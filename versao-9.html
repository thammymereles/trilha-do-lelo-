<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="App gratuito para crianças aprenderem a ler brincando, com narração em todas as telas: letras, traçado, sons, sílabas e leitura.">
<meta name="theme-color" content="#DFF3EE">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2230%22%20r%3D%2211%22%20fill%3D%22%236BC27A%22%2F%3E%3Cpath%20d%3D%22M4%2044Q4%2012%2030%2012Q54%2012%2054%2044Z%22%20fill%3D%22%232E9E6A%22%2F%3E%3Cpath%20d%3D%22M4%2044h50%22%20stroke%3D%22%23FFC93C%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2253%22%20cy%3D%2227%22%20r%3D%222.5%22%20fill%3D%22%231F3640%22%2F%3E%3C%2Fsvg%3E">
<title>Trilha do Lelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: uma coluna de app (máx. 760px); nos jogos, a pergunta fica no alto e as respostas ficam embaixo, perto do polegar.
   Visual único e claro de propósito (app infantil), sem tema escuro. */
:root{
  --sky:#DFF3EE; --sky-2:#C6E8DF; --paper:#FFFFFF; --ink:#1F3640; --ink-soft:#4E6A73; --line:#BBDDD3;
  --go:#138A7E; --go-deep:#0B5F56; --sun:#FFC93C; --sun-deep:#C98F00; --tang:#FF8A3D;
  --coral:#E4574C; --coral-soft:#FDE4E1; --ok:#1E9E5A; --ok-soft:#D6F4E4;
  --c-letras:#FF8A3D; --c-tracar:#FFC93C; --c-sons:#2F8FD8; --c-silabas:#E5487A; --c-ler:#2E9E6A; --c-pensar:#8B5CF6; --c-cuidar:#12A8B8; --c-quebra:#5B6CF0;
  --t-letras:#D9601A; --t-tracar:#A97400; --t-sons:#1C6BAE; --t-silabas:#C22F62; --t-ler:#1F7A50; --t-pensar:#6A3BD1; --t-cuidar:#0A7883; --t-quebra:#3A48C8;
  --f-kid:'Andika','Comic Sans MS','Trebuchet MS',sans-serif;
  --f-ui:'Fredoka','Andika','Trebuchet MS',system-ui,sans-serif;
  --f-emo:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-ui);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sky);z-index:10}
#app{min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:4px solid var(--tang);outline-offset:3px;border-radius:16px}
h1,h2,p{margin:0}
.emo{font-family:var(--f-emo);line-height:1;font-weight:400}
.e3d{display:inline-block;width:1.18em;height:1.18em;vertical-align:-.2em;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-select:none}
.e3d+.e3d{margin-left:.04em}
.k{font-family:var(--f-kid);font-weight:700}

.shell{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px;min-height:76px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--sky);z-index:5;padding-block:10px}
.grow{flex:1}
.ibtn{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 4px 0 var(--line);font-size:26px}
.ibtn svg,.hold svg{width:1em;height:1em}
.ibtn.big{width:60px;height:60px;font-size:30px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep)}
.ibtn.ghost{background:transparent;box-shadow:none;color:var(--ink-soft);width:48px;height:48px;font-size:22px}
.ibtn:active,.cta:active,.btn2:active,.st:active,.ut:active,.actb:active,.kid:active,.resume:active,.xcard:active,.chip:active{transform:translateY(3px)}
.ttl{font-size:21px;font-weight:600;line-height:1.15;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:5px 14px 5px 5px;min-height:52px;box-shadow:0 4px 0 var(--line);font-weight:600;font-size:18px;max-width:46vw}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.stars{padding:5px 14px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.stars svg{width:26px;height:26px;color:var(--sun)}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--sky-2);display:grid;place-items:center;font-size:26px}
.sec{font-size:20px;font-weight:600;margin-top:4px}

/* Lelo */
.lelo{display:block;height:auto;flex:none}
.lelo .mouth{transform-box:fill-box;transform-origin:center}
.lelo .head{transform-box:fill-box;transform-origin:20% 90%}
.lelo.talk .mouth{animation:talk .2s ease-in-out infinite alternate}
.lelo.talk .head{animation:nod 1s ease-in-out infinite}
@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(2.4)}}
@keyframes nod{50%{transform:rotate(-5deg)}}

/* Início */
.hero{background:var(--paper);border-radius:28px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 14px;align-items:center;box-shadow:0 6px 0 var(--line)}
.hero .lelo{width:118px}
.bubble{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:20px;padding:10px 12px;position:relative;min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);border:12px solid transparent;border-left:0;border-right-color:var(--sky)}
.nx-txt{display:flex;flex-direction:column;min-width:0}
.nx-txt small{font-size:14px;color:var(--ink-soft)}
.nx-txt strong{font-family:var(--f-kid);font-size:22px;line-height:1.15}
.nx-txt span{font-size:14px;color:var(--ink-soft)}
.uv{flex:none;min-width:64px;height:64px;padding:0 8px;border-radius:16px;background:var(--paper);display:grid;place-items:center;font-family:var(--f-kid);font-weight:700;font-size:32px;color:var(--ct,var(--ink));box-shadow:inset 0 0 0 3px var(--cb,var(--line))}
.uv .emo{font-size:36px}
.cta{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--go);color:#fff;font-size:26px;font-weight:700;min-height:76px;border-radius:24px;box-shadow:0 7px 0 var(--go-deep);padding:0 18px}
.cta svg{width:32px;height:32px;flex:none}
.novoice{background:var(--coral-soft);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:16px}

.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.st{grid-column:span 2;position:relative;background:var(--paper);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:0 6px 0 var(--c);border:3px solid var(--c)}
.st-ico{height:86px;border-radius:16px;background:var(--c);color:var(--on);display:grid;place-items:center;font-family:var(--f-kid);font-size:50px;font-weight:700}
.st-ico .emo{font-size:52px}
.st-name{font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
.bar{display:block;height:12px;background:var(--sky);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--go));border-radius:99px}
.st-num{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.flag{position:absolute;top:-12px;left:12px;background:var(--sun);color:var(--ink);font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;box-shadow:0 2px 0 var(--sun-deep);display:inline-flex;gap:4px;align-items:center;z-index:1}
.flag svg{width:14px;height:14px}
.extras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.xcard{background:var(--paper);border-radius:24px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 0 var(--line);min-height:96px;text-align:left}
.xcard .emo{font-size:44px}
.xcard b{display:block;font-size:18px}
.xcard span.n{color:var(--ink-soft);font-size:14px;font-variant-numeric:tabular-nums}

/* Etapa e unidade */
.sprog{display:flex;flex-direction:column;gap:6px}
.sprog .bar{background:var(--paper)}
.sprog span{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.resume{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:24px;padding:12px;border:3px solid var(--go);box-shadow:0 6px 0 var(--go-deep);text-align:left}
.resume small{display:block;font-size:14px;color:var(--ink-soft)}
.resume strong{font-family:var(--f-kid);font-size:22px}
.playdot{flex:none;margin-left:auto;width:58px;height:58px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;font-size:26px}
.playdot svg{width:1em;height:1em}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px}
.ut{position:relative;background:var(--paper);border-radius:22px;padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 0 var(--line);border:3px solid transparent}
.ut.rec{border-color:var(--sun);box-shadow:0 5px 0 var(--sun-deep)}
.ut.done{background:var(--ok-soft)}
.ut-big{font-family:var(--f-kid);font-weight:700;font-size:42px;line-height:1;color:var(--ct)}
.ut-big .emo{font-size:44px}
.ut-cap{font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.2;padding:0 2px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--sky-2)}
.dots i.on{background:var(--go)}
.badge-ok{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;font-size:16px}
.badge-ok svg{width:1em;height:1em}
.ucard{background:var(--paper);border-radius:28px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 14px;box-shadow:0 6px 0 var(--line)}
.ubig{font-family:var(--f-kid);font-size:clamp(76px,22vw,130px);font-weight:700;line-height:1;color:var(--ct)}
.ubig .emo{font-size:.8em}
.upic{font-size:76px;text-align:center}
.ucap{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-family:var(--f-kid);font-size:24px;font-weight:700}
.acts{display:flex;flex-direction:column;gap:14px}
.actb{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:22px;padding:12px;min-height:86px;box-shadow:0 5px 0 var(--line);text-align:left}
.actb.rec{box-shadow:0 5px 0 var(--sun-deep);outline:3px solid var(--sun);outline-offset:-3px}
.actico{flex:none;width:62px;height:62px;border-radius:16px;background:var(--sky);display:grid;place-items:center;font-size:32px;font-family:var(--f-kid);font-weight:700;color:var(--ct)}
.actname{font-size:20px;font-weight:600;flex:1;min-width:0;line-height:1.2}
.stars3{display:inline-flex;gap:2px;flex:none}
.stars3 svg{width:22px;height:22px;color:var(--sky-2)}
.stars3 .on svg{color:var(--sun)}

/* Jogo */
.game{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px max(16px,env(safe-area-inset-bottom,0px))}
#app:has(.game){height:100%}
.gbar{display:flex;align-items:center;gap:12px;min-height:68px}
.hold{flex:none;position:relative;width:56px;height:56px;border-radius:50%;background:var(--paper);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:26px;touch-action:none;user-select:none;-webkit-user-select:none}
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
.hold::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--tang) var(--p),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));pointer-events:none}
.hold.holding::after{animation:fill .9s linear forwards}
@keyframes fill{to{--p:100%}}
.rdots{flex:1;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.rdots i{width:15px;height:15px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.rdots i.on{background:var(--go);box-shadow:none}
.rdots i.cur{background:var(--sun);box-shadow:none;transform:scale(1.3)}
.ask{display:flex;flex-direction:column;align-items:center;gap:10px}
.ask-row{display:flex;align-items:center;gap:8px;max-width:100%}
.ask-row .lelo{width:82px}
.ask-card{background:var(--paper);border-radius:28px;padding:16px 22px;min-width:150px;min-height:150px;display:grid;place-items:center;box-shadow:0 6px 0 var(--line);max-width:100%}
.ask-card.build{display:flex;flex-direction:column;align-items:center;gap:12px}
.ask-text{font-size:15px;color:var(--ink-soft);text-align:center}
.showglyph{font-family:var(--f-kid);font-weight:700;font-size:112px;line-height:1;color:var(--ct)}
.earbtn{width:118px;height:118px;border-radius:50%;background:var(--sun);box-shadow:0 6px 0 var(--sun-deep);font-size:58px;display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite}
.earbtn svg{width:1em;height:1em}
.picbtn{position:relative;display:grid;place-items:center;padding:4px}
.picbtn .emo{font-size:100px}
.spk-badge{position:absolute;right:-12px;bottom:-6px;width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 var(--sun-deep)}
.spk-badge svg{width:1em;height:1em}
.showword{font-family:var(--f-kid);font-weight:700;font-size:clamp(46px,13vw,86px);letter-spacing:.08em;line-height:1.1;color:var(--ct)}
.sentence{font-family:var(--f-kid);font-weight:700;font-size:clamp(28px,7.4vw,44px);line-height:1.4;text-align:center;max-width:16ch;text-wrap:balance}
.sentence span{border-radius:10px;padding:0 4px;transition:background .12s}
.sentence span.on{background:var(--sun)}
.answers{margin-top:auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;padding-top:8px}
.answers.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.optw{position:relative;min-width:0}
.opt{width:100%;background:var(--paper);border-radius:24px;display:grid;place-items:center;aspect-ratio:1;max-height:170px;box-shadow:0 7px 0 var(--line);border:4px solid transparent;transition:transform .1s,opacity .2s;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.glyph{font-family:var(--f-kid);font-weight:700;font-size:clamp(50px,15vw,90px);line-height:1}
.opt .emo{font-size:clamp(50px,14vw,82px)}
.opt.pair .emo{font-size:clamp(34px,9vw,58px);letter-spacing:-.05em}
.syl{font-family:var(--f-kid);font-weight:700;font-size:clamp(32px,10vw,54px);letter-spacing:.03em}
.opt.k-word{aspect-ratio:auto;min-height:100px}
.word{font-family:var(--f-kid);font-weight:700;font-size:clamp(21px,6vw,34px);letter-spacing:.06em}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{animation:shake .45s;border-color:var(--coral);background:var(--coral-soft)}
.opt.off{opacity:.3;pointer-events:none}
.opt.used{opacity:.2;pointer-events:none}
.opt.hint{border-color:var(--sun);animation:glow 1s ease-in-out infinite}
.mini{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 var(--sun-deep);z-index:1}
.mini svg{width:1em;height:1em}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot{min-width:74px;height:74px;padding:0 8px;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center;font-family:var(--f-kid);font-weight:700;font-size:34px}
.slot.full{border-style:solid;border-color:var(--go);background:var(--ok-soft)}
.trace-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:auto;width:100%}
.tbox{position:relative;background:var(--paper);border-radius:28px;box-shadow:0 6px 0 var(--line);width:100%;max-width:440px;aspect-ratio:1}
.tbox canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:28px}
#cu{touch-action:none;cursor:crosshair}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px}
.btn2{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper);min-height:64px;border-radius:22px;box-shadow:0 5px 0 var(--line);font-size:20px;font-weight:600;padding:0 14px}
.btn2 svg{width:26px;height:26px;flex:none}
.cta.sm{min-height:64px;font-size:21px;grid-column:auto}
.cf{position:fixed;width:11px;height:11px;border-radius:3px;pointer-events:none;z-index:50;animation:cf .8s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(280deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes glow{50%{box-shadow:0 7px 0 var(--sun-deep),0 0 0 9px rgba(255,201,60,.5)}}
@keyframes pulse{50%{transform:scale(1.06)}}

/* Fim */
.endcard{background:var(--paper);border-radius:32px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 6px 0 var(--line);margin-top:20px}
.endcard .lelo{width:150px}
.endcard h1{font-size:30px;text-align:center}
.bigstars{display:flex;gap:10px}
.bs svg{width:70px;height:70px;color:var(--sky-2)}
.bs.on svg{color:var(--sun)}
.bs.on{animation:pop .5s var(--d) both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.newst{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:20px;padding:10px 16px;font-size:18px;font-weight:600}
.newst .emo{font-size:54px;animation:pop .6s .8s both}
.endbtns{display:grid;gap:14px;width:100%;max-width:440px}
.endbtns .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Perfis */
.center{align-items:center;text-align:center}
.center .lelo{width:170px}
.hello{font-size:32px;font-weight:700}
.kids{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.kid{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border-radius:28px;padding:18px 22px;min-width:140px;box-shadow:0 6px 0 var(--line)}
.av.xl{width:96px;height:96px;font-size:60px}
.kname{font-family:var(--f-kid);font-size:24px;font-weight:700}
.link{display:inline-flex;gap:8px;align-items:center;color:var(--ink-soft);font-size:16px;min-height:48px;padding:0 14px;border-radius:12px}
.link svg{width:18px;height:18px}

/* Álbum e conquistas */
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.stk{aspect-ratio:1;background:var(--paper);border-radius:18px;display:grid;place-items:center;box-shadow:0 4px 0 var(--line)}
.stk .emo{font-size:40px}
.stk:not(.on){background:transparent;box-shadow:inset 0 0 0 3px var(--sky-2)}
.stk:not(.on) .emo{filter:brightness(0);opacity:.13}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tro{background:var(--paper);border-radius:24px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 0 var(--line);text-align:center}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:40px}
.tro.no .ring .emo{filter:grayscale(1);opacity:.35}
.tro b{font-size:16px;line-height:1.2}
.tro span{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* Área dos pais (para adultos: texto normal, densidade maior) */
.adult .panel{background:var(--paper);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 0 var(--line)}
.panel h2{font-size:19px;font-weight:600}
.panel h3{font-size:16px;font-weight:600;margin:4px 0 0}
.panel p{line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--sky);border-radius:14px;padding:12px}
.kpi small{display:block;color:var(--ink-soft);font-size:13px}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wd i{width:100%;max-width:34px;background:var(--go);border-radius:8px 8px 3px 3px;min-height:3px}
.wd span,.wd b{font-size:12px;font-variant-numeric:tabular-nums}
.wd span{color:var(--ink-soft)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:15px}
.prow .bar{grid-column:1/-1}
.prow em{font-style:normal;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{background:var(--coral-soft);border-radius:12px;padding:6px 12px;font-family:var(--f-kid);font-weight:700;font-size:20px}
.lchip small{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--ink-soft);margin-left:6px}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--sky-2);font-size:15px}
.log li small{color:var(--ink-soft);font-size:13px}
.ptabs{display:flex;flex-wrap:wrap;gap:8px}
.ptab{background:var(--sky);border-radius:14px;min-height:46px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.ptab.on{background:var(--go);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btnp,.btnq,.btnd{border-radius:14px;min-height:48px;padding:0 18px;font-weight:600;font-size:16px}
.btnp{background:var(--go);color:#fff}
.btnq{background:var(--sky)}
.btnd{background:var(--coral-soft);color:#9C2219}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14px;font-weight:600}
input[type=text],input[type=number],select{font:inherit;font-size:18px;min-height:50px;border-radius:12px;border:2px solid var(--line);padding:0 12px;background:#fff;color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--go)}
.avpick{display:flex;flex-wrap:wrap;gap:8px}
.avpick input{position:absolute;opacity:0;pointer-events:none}
.avpick label{width:52px;height:52px;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:30px;cursor:pointer;border:3px solid transparent}
.avpick input:checked+label{border-color:var(--go);background:var(--ok-soft)}
.avpick input:focus-visible+label{outline:4px solid var(--tang)}
.warn{background:var(--coral-soft);padding:12px 14px;border-radius:12px}
.okline{background:var(--ok-soft);padding:12px 14px;border-radius:12px}
.note{font-size:13px;color:var(--ink-soft)}
.err{color:#9C2219;font-size:15px;min-height:1.2em}
.tag{display:inline-block;background:var(--sun);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle}
.gateq{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-size:16px}
.check input{width:24px;height:24px;accent-color:var(--go)}

/* Pensar e Mexer (lógica e coordenação) */
.ask-row:has(.seqrow) .lelo{display:none}
.seqrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;max-width:min(88vw,560px)}
.sq{font-size:clamp(30px,8.4vw,48px)}
.sq.q{font-family:var(--f-kid);font-weight:700;color:var(--ct);width:1.25em;height:1.25em;border:3px dashed var(--ct);border-radius:12px;display:grid;place-items:center;font-size:clamp(24px,6.6vw,38px);animation:pulse 1.6s ease-in-out infinite}
.mem{margin-top:auto;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px;width:100%;max-width:520px;align-self:center}
.mcard{aspect-ratio:1;border-radius:18px;background:var(--c-pensar);box-shadow:0 5px 0 var(--t-pensar);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .2s}
.mcard>*{grid-area:1/1}
.mback{font-family:var(--f-kid);font-weight:700;font-size:clamp(28px,8vw,44px);color:#fff;transition:opacity .15s}
.mface{font-size:clamp(34px,10vw,58px);opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s}
.mcard.open,.mcard.done{background:var(--paper);box-shadow:0 5px 0 var(--line)}
.mcard.open .mback,.mcard.done .mback{opacity:0}
.mcard.open .mface,.mcard.done .mface{opacity:1;transform:none}
.mcard.done{background:var(--ok-soft);pointer-events:none}
.oslot{min-width:64px;height:78px}
.shadows{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.zone{width:clamp(76px,21vw,120px);aspect-ratio:1;border-radius:22px;background:var(--paper);box-shadow:inset 0 0 0 3px var(--sky-2);display:grid;place-items:center;cursor:pointer}
.zone .emo{font-size:clamp(44px,12.5vw,76px);filter:brightness(0);opacity:.24;transition:filter .3s,opacity .3s}
.zone.full{background:var(--ok-soft);box-shadow:inset 0 0 0 3px var(--ok)}
.zone.full .emo{filter:none;opacity:1}
.zone.wrong{animation:shake .45s;box-shadow:inset 0 0 0 3px var(--coral)}
.zone.hint{box-shadow:inset 0 0 0 4px var(--sun);animation:glow 1s ease-in-out infinite}
.dragrow{margin-top:auto;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding-top:12px}
.drag{width:clamp(76px,21vw,120px);aspect-ratio:1;border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--line);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;position:relative;z-index:2}
.drag .emo{font-size:clamp(44px,12.5vw,76px)}
.drag.lift{z-index:20;box-shadow:0 16px 26px rgba(0,0,0,.18);cursor:grabbing}
.drag.sel{outline:4px solid var(--sun);outline-offset:2px}
.drag.placed{visibility:hidden}
.pond{position:relative;flex:1;min-height:320px;border-radius:28px;background:linear-gradient(#EEF9FF,#CFEAF8);overflow:hidden;touch-action:manipulation;box-shadow:inset 0 0 0 3px #B5DDF2}
.bub{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.4) 10% 36%,rgba(160,210,255,.3) 62%,rgba(110,175,250,.55) 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 4px 12px rgba(60,120,180,.18);display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bub .emo{font-size:.5em}
.bub .bl{font-family:var(--f-kid);font-weight:700;font-size:.52em;line-height:1;color:var(--t-pensar)}
.bub.pop{animation:bpop .22s ease-out forwards;pointer-events:none}
.bub.no{animation:shake .4s}
@keyframes bpop{to{transform:scale(1.6);opacity:0}}
.bcount{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.bcount i{width:16px;height:16px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.bcount i.on{background:var(--go);box-shadow:none}
.pfig{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:2;line-height:1}

/* Carros e trens, Mexa o corpo */
.dwrap{margin-top:auto;display:flex;justify-content:center;padding-bottom:4px}
.dbox{position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 18% 82%,#BCE4A9 0 10%,transparent 11%),radial-gradient(circle at 84% 70%,#BCE4A9 0 8%,transparent 9%),#D3EEC4;box-shadow:inset 0 0 0 3px #A8D69A;touch-action:none;user-select:none;-webkit-user-select:none}
.dbox canvas{position:absolute;inset:0;width:100%;height:100%}
.gar{position:absolute;transform:translate(-50%,-62%);width:2.1em;height:2em;border-radius:.35em .35em .25em .25em;background:var(--paper);box-shadow:0 .12em 0 var(--line),inset 0 .3em 0 var(--coral);display:grid;place-items:center;padding-top:.28em;z-index:1;touch-action:none}
.gar .emo{font-size:1.1em}
.gar .glyph{font-size:1.25em;color:var(--t-pensar)}
.gar.ok{background:var(--ok-soft);box-shadow:0 .12em 0 var(--line),inset 0 .3em 0 var(--ok)}
.gar.wrong{animation:shake .45s}
.gar.hint{animation:glow 1s ease-in-out infinite}
.car{position:absolute;z-index:2;pointer-events:none;line-height:1}
.car.nudge{filter:drop-shadow(0 0 6px #FFC93C) drop-shadow(0 0 3px #FFC93C)}
.lanes{position:relative;flex:1;min-height:270px;max-height:440px;border-radius:24px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(90deg,rgba(255,255,255,.9) 0 50%,transparent 50%) 0 33.33%/60px 4px repeat-x,linear-gradient(90deg,rgba(255,255,255,.9) 0 50%,transparent 50%) 0 66.66%/60px 4px repeat-x,#8E9AA6;
  box-shadow:inset 0 7px 0 #7CC46A,inset 0 -7px 0 #7CC46A}
.lcar{position:absolute;left:10px;display:grid;place-items:center;line-height:1;transform:scaleX(-1);transition:top .18s ease-out;z-index:2;pointer-events:none}
.lcar.bump{animation:bump .45s}
@keyframes bump{0%,100%{transform:scaleX(-1)}30%{transform:scaleX(-1) rotate(-14deg)}65%{transform:scaleX(-1) rotate(9deg)}}
.litem{position:absolute;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(0,0,0,.15);pointer-events:none}
.litem .emo{font-size:.58em}
.litem .bl{font-family:var(--f-kid);font-weight:700;font-size:.62em;line-height:1;color:var(--t-pensar)}
.litem.pop{animation:bpop .22s ease-out forwards}
.litem.no{opacity:.4}
.rail{position:relative;overflow:hidden;padding:6px 4px 16px;margin:auto -16px 0}
.rail::after{content:'';position:absolute;left:0;right:0;bottom:4px;height:10px;background:linear-gradient(#8E9AA6,#8E9AA6) 0 0/100% 3px no-repeat,repeating-linear-gradient(90deg,#A0703F 0 7px,transparent 7px 24px)}
.train{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;gap:6px;animation:arrive 1.1s ease-out backwards;transition:transform 1.9s ease-in}
.train.go{transform:translateX(-140vw)}
@keyframes arrive{from{transform:translateX(110vw)}}
.loco{font-size:clamp(64px,18vw,96px);line-height:1;margin-bottom:-4px}
.wagon{position:relative;min-width:clamp(62px,17vw,90px);height:clamp(54px,14vw,70px);border-radius:12px 12px 6px 6px;border:3px dashed var(--t-pensar);background:#F2ECFF;margin-bottom:12px;font-size:clamp(22px,6.6vw,34px)}
.wagon::after{content:'';position:absolute;left:8%;right:8%;bottom:-15px;height:16px;background:radial-gradient(circle,#3A3F4A 0 6px,transparent 7px) left/16px 16px no-repeat,radial-gradient(circle,#3A3F4A 0 6px,transparent 7px) right/16px 16px no-repeat}
.wagon.full{border-style:solid;border-color:var(--t-pensar);background:var(--c-pensar);color:#fff}
.opt.wag{aspect-ratio:auto;min-height:84px}
.opt.wag .syl{font-size:clamp(24px,7vw,44px)}
.bodycard{margin:auto 0;align-self:center;background:var(--paper);border-radius:28px;box-shadow:0 6px 0 var(--line);padding:18px 26px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:220px;transition:transform .15s}
.bodycard.beat{transform:scale(1.06)}
.bfig{font-size:clamp(90px,28vw,150px);line-height:1}
.bfig.sm{font-size:clamp(60px,17vw,90px)}
.bglyph{font-family:var(--f-kid);font-weight:700;font-size:clamp(110px,34vw,170px);line-height:1;color:var(--t-pensar)}
.claps{display:flex;gap:10px}
.claps span{font-family:var(--f-kid);font-weight:700;font-size:clamp(26px,8vw,40px);padding:6px 12px;border-radius:14px;background:#F2ECFF;color:var(--t-pensar);transition:background .15s,transform .15s}
.claps span.on{background:var(--c-pensar);color:#fff;transform:scale(1.12)}
.btimer{width:180px;height:12px;border-radius:8px;background:var(--sky-2);overflow:hidden}
.btimer[hidden]{display:none}
.btimer i{display:block;height:100%;width:0;background:var(--c-pensar);border-radius:8px}
.bdone{min-height:84px;display:flex;justify-content:center}
.bdone .cta{min-width:220px;animation:pulse 1.4s ease-in-out infinite}
.bdone .cta[hidden]{display:none}

/* Cuidar de Mim */
.cwrap{margin-top:auto;display:flex;justify-content:center}
.scene{position:relative;border-radius:28px;background:linear-gradient(#EAF8FB,#CDEEF5);box-shadow:inset 0 0 0 3px #A9DDE8;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;transition:box-shadow .3s}
.scene.shine{box-shadow:inset 0 0 0 3px #A9DDE8,0 0 0 6px var(--sun),0 0 28px var(--sun)}
.hfig{position:absolute;left:7%;top:7%;width:86%;height:86%;display:grid;place-items:center;line-height:1;pointer-events:none}
.hfig .e3d{width:100%;height:100%;vertical-align:0}
.spot{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;line-height:1;pointer-events:none}
.spot.mud{background:radial-gradient(circle at 38% 36%,#8A5A2E 0 22%,#5C3A1A 55%,rgba(92,58,26,0) 72%);border-radius:46% 54% 50% 50%/55% 45% 55% 45%}
.spot.foam{background:radial-gradient(circle at 30% 35%,#fff 0 24%,transparent 25%),radial-gradient(circle at 66% 38%,#fff 0 27%,transparent 28%),radial-gradient(circle at 48% 68%,#fff 0 26%,transparent 27%),radial-gradient(circle at 24% 70%,#F4FCFF 0 14%,transparent 15%),radial-gradient(circle at 77% 72%,#F4FCFF 0 13%,transparent 14%);filter:drop-shadow(0 1px 1px rgba(70,130,160,.45))}
.spot.gone{display:none}
.spot.pop{animation:spop .3s ease-out}
@keyframes spop{from{transform:translate(-50%,-50%) scale(.3)}}
.tool{position:absolute;z-index:3;line-height:1;pointer-events:none;transform:translate(-30%,-70%) rotate(-14deg);animation:wob .22s ease-in-out infinite alternate}
.tool[hidden]{display:none}
@keyframes wob{to{transform:translate(-30%,-70%) rotate(12deg)}}
.dock{display:flex;justify-content:center;padding-top:8px}
.dtool{width:84px;height:84px;border-radius:24px;background:var(--paper);box-shadow:0 6px 0 var(--line);display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite}
.dtool .emo{font-size:52px}
.stline{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.stslot{width:clamp(52px,15vw,76px);aspect-ratio:1;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center}
.stslot i{font-style:normal;font-family:var(--f-kid);font-weight:700;font-size:22px;color:var(--ink-soft)}
.stslot.full{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.stslot .emo{font-size:clamp(32px,10vw,50px)}
/* Quebra-cabeças */
.pz{position:relative;margin-top:auto;width:100%}
.pzb{position:absolute;top:0;border-radius:18px;background:var(--paper);box-shadow:0 6px 0 var(--line);overflow:hidden;transition:box-shadow .3s}
.pzb.done{box-shadow:0 6px 0 var(--line),0 0 0 5px var(--ok)}
.pzg{opacity:.16;pointer-events:none}
.pzb.done .pzg{opacity:0}
.pzc{position:absolute;box-shadow:inset 0 0 0 1px rgba(31,54,64,.13);cursor:pointer}
.pzc.hint{background:rgba(255,201,60,.4);box-shadow:inset 0 0 0 4px var(--sun)}
.pzc.wrong{background:var(--coral-soft)}
.pzp{position:absolute;left:0;top:0;overflow:hidden;border-radius:8px;background:#FFFDF6;box-shadow:0 3px 0 rgba(31,54,64,.2),inset 0 0 0 2px #fff;transform-origin:0 0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:left .25s,top .25s,transform .25s;z-index:2}
.pzp.drag{transition:none;z-index:30;box-shadow:0 14px 24px rgba(0,0,0,.22);cursor:grabbing}
.pzp.sel{outline:4px solid var(--sun);outline-offset:1px;z-index:3}
.pzp.placed{border-radius:0;box-shadow:none;cursor:default;z-index:1;pointer-events:none;background:transparent}
.pzi{position:absolute;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle at 18% 20%,#FFE59A 0 16%,transparent 17%),radial-gradient(circle at 82% 78%,#C9F0D6 0 18%,transparent 19%),linear-gradient(135deg,#FFE9B0,#FFD0DC 50%,#C8E6FF)}
.pzl{font-family:var(--f-kid);font-weight:700;line-height:.8;padding-top:.06em;color:var(--t-quebra);-webkit-text-stroke:.02em #fff;paint-order:stroke}
.pzf{display:grid;place-items:center;line-height:1}
.pzf .e3d{width:100%;height:100%;vertical-align:0}

/* Mexa o corpo: animações */
.mstage{position:relative;flex:1;min-height:250px;max-height:420px;border-radius:28px;overflow:hidden;background:linear-gradient(#D7F0FF,#F2FAFF 72%);box-shadow:inset 0 0 0 3px #BFE3F5}
.mground{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(#9BD77E,#79C15C)}
.cl{position:absolute;width:84px;height:28px;border-radius:28px;background:#fff;opacity:.95}
.cl::before{content:'';position:absolute;left:16px;top:-16px;width:42px;height:38px;border-radius:50%;background:#fff}
.c1{top:13%;left:8%}.c2{top:29%;left:64%;transform:scale(.7)}
.m-fly.run .cl{animation:cloud 6s linear -2.5s infinite}.m-fly.run .c2{animation-duration:9s;animation-delay:-6s}
@keyframes cloud{from{left:105%}to{left:-35%}}
.mbox{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);display:grid;place-items:center;z-index:1}
.mfig{display:block;font-size:clamp(84px,27vw,134px);line-height:1;transform-origin:50% 100%}
.mshadow{position:absolute;left:50%;bottom:13%;width:110px;height:18px;margin-left:-55px;border-radius:50%;background:rgba(40,90,40,.25)}
.mpuff{position:absolute;bottom:14%;width:26px;height:26px;border-radius:50%;background:#fff;opacity:0}
.p1{left:calc(50% - 76px)}.p2{left:calc(50% + 50px)}
.mfig.beat{animation:mjump .75s cubic-bezier(.3,.7,.4,1)}
@keyframes mjump{0%{transform:scale(1.15,.85)}35%{transform:translateY(-70%) scale(.92,1.1)}60%{transform:translateY(-70%)}90%{transform:scale(1.12,.88)}100%{transform:none}}
.m-hop .mfig.beat{animation-name:mhop}
@keyframes mhop{0%{transform:scale(1.1,.9)}40%{transform:translateY(-58%) rotate(-12deg)}75%{transform:translateY(-12%) rotate(6deg)}100%{transform:none}}
.m-stomp .mfig.beat{animation:mstomp .6s ease-in}
@keyframes mstomp{0%{transform:none}45%{transform:translateY(-14%) rotate(-7deg)}70%{transform:scale(1.07,.93)}100%{transform:none}}
.mshadow.beat{animation:mshadow .75s}
@keyframes mshadow{35%,60%{transform:scale(.55);opacity:.5}}
.mpuff.beat{animation:mpuff .5s .5s ease-out}
.m-stomp .mpuff.beat{animation-delay:.3s}
@keyframes mpuff{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:translateY(-14px) scale(1.7)}}
.mstage.shake{animation:shake .4s .3s}
.m-walk.run .mfig{animation:mwalk 10s linear infinite}
@keyframes mwalk{0%{transform:translateX(-75%) scaleX(-1)}48%{transform:translateX(75%) scaleX(-1)}50%{transform:translateX(75%)}98%{transform:translateX(-75%)}100%{transform:translateX(-75%) scaleX(-1)}}
.m-side.run .mfig{animation:mside 3.2s ease-in-out infinite}
@keyframes mside{0%,100%{transform:translateX(-70%)}25%,75%{transform:translateX(0) translateY(-6%)}50%{transform:translateX(70%)}}
.m-sway .mfig{transform-origin:50% 95%}
.m-sway.run .mfig{animation:msway 2.6s ease-in-out infinite alternate}
@keyframes msway{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.mbreath{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.6);background:radial-gradient(circle,rgba(18,168,184,.3),rgba(18,168,184,0) 70%)}
.m-breathe.run .mbreath{animation:mbreath 8s ease-in-out infinite}

const Voice={list:[],v:null,ok:false,checked:false,supported:'speechSynthesis' in window};
function pickVoice(){
  if(!Voice.supported)return;
  const all=speechSynthesis.getVoices()||[];
  Voice.list=all.filter(v=>/^pt/i.test(v.lang));
  let v=Voice.list.find(v=>v.voiceURI===DB.settings.voice);
  if(!v){const br=Voice.list.filter(v=>/pt[-_]BR/i.test(v.lang));
    v=br.find(v=>/natural|online|google|francisca|luciana|thalita|camila|vitoria/i.test(v.name))||br[0]||Voice.list[0]||null;}
  Voice.v=v;Voice.ok=!!v;if(all.length)Voice.checked=true;
}
if(Voice.supported){pickVoice();speechSynthesis.onvoiceschanged=()=>{const was=Voice.ok;pickVoice();if(was!==Voice.ok&&['home','parents'].includes(S.screen))render();};
  setTimeout(()=>{Voice.checked=true;pickVoice();if(!Voice.ok&&S.screen==='home')render();},1500);}
let talking=false,speakId=0;
function setTalking(on){talking=on;if(window.Music)Music.duck(on);$$('.lelo').forEach(l=>l.classList.toggle('talk',on));}
function say(text,opts={}){
  return new Promise(res=>{
    const id=++speakId;
    const done=()=>{if(id===speakId)setTalking(false);res();};
    if(!text){res();return;}
    setTalking(true);
    if(!Voice.supported){setTimeout(done,Math.min(2600,text.length*55));return;}
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang=Voice.v?Voice.v.lang:'pt-BR';if(Voice.v)u.voice=Voice.v;
      u.rate=DB.settings.rate;u.pitch=1.08;
      let fin=false;const end=()=>{if(fin)return;fin=true;clearTimeout(t);done();};
      u.onend=end;u.onerror=end;
      if(opts.onb)u.onboundary=e=>{if(!e.name||e.name==='word')opts.onb(e.charIndex);};
      const t=setTimeout(end,1800+text.length*120/DB.settings.rate);
      speechSynthesis.speak(u);
    }catch(e){done();}
  });
}
function hush(){speakId++;setTalking(false);try{Voice.supported&&speechSynthesis.cancel();}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(window.Music)Music.stop();}});

let AC=null;
function ensureAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f1,f2,dur,type,when=0,vol=.16){if(!AC||!DB.settings.sfx)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function sfx(k){if(k==='ok'){tone(660,660,.13,'sine');tone(880,880,.13,'sine',.11);tone(1320,1320,.22,'sine',.22);}else if(k==='no'){tone(320,170,.28,'triangle',0,.2);}else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,f,.22,'sine',i*.13));}else if(k==='tap'){tone(520,560,.07,'sine',0,.09);}else if(k==='vrum'){tone(70,140,.45,'sawtooth',0,.05);tone(140,90,.3,'sawtooth',.4,.04);}else if(k==='beep'){tone(760,760,.09,'square',0,.05);tone(760,760,.09,'square',.16,.05);}else if(k==='piui'){tone(880,1180,.32,'triangle',0,.1);tone(880,1180,.45,'triangle',.4,.1);}else if(k==='clap'){tone(2200,500,.07,'square',0,.07);}else if(k==='scrub'){tone(260,210,.06,'triangle',0,.035);}else if(k==='freeze'){tone(1400,500,.25,'sine',0,.12);tone(1800,900,.2,'sine',.05,.06);}}

  for(let i=0;i<16;i++){const s=document.createElement('span'),a=Math.random()*Math.PI*2,d=60+Math.random()*80;s.className='cf';s.style.cssText=`left:${b.left+b.width/2}px;top:${b.top+b.height/2}px;background:${cols[i%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),850);}}

var Music={cur:null,timer:null,step:0,next:0,g:null,duckOn:false,noise:null,
 vol(){return DB.settings.music===false?0:(this.duckOn?.14:.42);},
 setup(){if(!AC)return false;if(!this.g){this.g=AC.createGain();this.g.gain.value=0;this.g.connect(AC.destination);
   const b=AC.createBuffer(1,Math.floor(AC.sampleRate*.5),AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noise=b;}return true;},
 play(id){ensureAudio();const s=SONGS[id];if(!s||DB.settings.music===false||!this.setup())return;if(this.cur===s&&this.timer)return;this.stop(true);
   this.cur=s;this.step=0;this.next=AC.currentTime+.06;const t=AC.currentTime;this.g.gain.cancelScheduledValues(t);this.g.gain.setValueAtTime(this.vol(),t);
   this.timer=setInterval(()=>this.tick(),25);this.tick();},
 stop(quick){if(this.timer){clearInterval(this.timer);this.timer=null;}this.cur=null;
   if(this.g&&AC){const t=AC.currentTime;this.g.gain.cancelScheduledValues(t);this.g.gain.setValueAtTime(this.g.gain.value,t);this.g.gain.linearRampToValueAtTime(0,t+(quick?.03:.12));}},

 tick(){const s=this.cur;if(!s||!AC)return;const sd=60/s.bpm/2;while(this.next<AC.currentTime+.15){this.note(s,this.step,this.next,sd);this.next+=sd;this.step++;}},

   if(p===0||p===4)CHORD[s.chords[bar]].forEach(nm=>this.pad(nfreq(nm),t,sd*3.6));

   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(a||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);

   g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(this.g);o.start(t);o.stop(t+.2);},

   g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(this.g);s.start(t);s.stop(t+dur+.02);},
 snare(t){this.nz(t,.14,.2,'bandpass',1900);this.osc('triangle',190,t,.08,.07);},

};

let S={screen:'profiles',p:null};
let G=null,TOK=0;   // TOK: identificador único de cada rodada (evita que uma fala antiga avance outra atividade)
const cur=()=>DB.profiles.find(p=>p.id===S.p);
const isDone=(p,k)=>!!(p&&p.done[k]);
const unitDone=(p,u)=>u.acts.every(a=>isDone(p,a.key));
const nextAct=p=>{const k=PATH.find(k=>!isDone(p,k));return k?ACTS[k]:null;};
const nextInStage=(p,st)=>{const k=PATH.find(k=>ACTS[k].unit.stage===st&&!isDone(p,k));return k?ACTS[k]:null;};
const nextAfter=(p,a)=>a.unit.acts.find(x=>!isDone(p,x.key))||nextAct(p);
function stageProg(p,st){let d=0,t=0;STAGE(st).units.forEach(u=>u.acts.forEach(a=>{t++;if(isDone(p,a.key))d++;}));return{d,t};}
function totals(p){let d=0,stars=0;Object.keys(p.done).forEach(k=>{if(ACTS[k]){d++;stars+=p.done[k].stars;}});return{d,t:PATH.length,stars};}
function stickers(p){let e=0,t=0;Object.values(UNITS).forEach(u=>{t++;if(unitDone(p,u))e++;});return{e,t};}
function record(a,stars,errors){const p=cur();const was=unitDone(p,a.unit),prev=p.done[a.key];
  p.done[a.key]={stars:Math.max(stars,prev?prev.stars:0),errors,plays:(prev?prev.plays:0)+1,last:Date.now()};
  p.log.unshift({k:a.key,at:Date.now(),stars,errors});p.log=p.log.slice(0,60);save();return !was&&unitDone(p,a.unit);}
function addTime(ms){const p=cur();if(!p||!(ms>0))return;ms=Math.min(ms,20*60000);const d=dayKey();p.time[d]=(p.time[d]||0)+ms;save();}
function bumpErr(L){const p=cur();if(!p||!L)return;p.err[L]=(p.err[L]||0)+1;save();}

/* ================= Sincronização com a conta ================= */
/* Área privada de cada conta: data/users/<id>/familia (ajustes e lista de crianças)
   e data/users/<id>/crianca-<pid> (progresso de cada criança). */
const IN_CLAUDE=!!(window.claude&&window.claude.use);   // aberto pelo link do Claude (pode salvar na conta) ou num site comum
const canon=v=>v===null||typeof v!=='object'?JSON.stringify(v===undefined?null:v):Array.isArray(v)?'['+v.map(canon).join(',')+']':'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
const kidOf=p=>({pid:p.id,done:p.done,log:p.log,err:p.err,time:p.time,resetAt:p.resetAt||0});
const famOf=()=>({v:1,settings:DB.settings,profiles:DB.profiles.map(p=>({id:p.id,name:p.name,avatar:p.avatar,example:!!p.example}))});
function mergeKid(a,b){
  if(!b)return a;if(!a)return b;
  const R=Math.max(a.resetAt||0,b.resetAt||0),cur2=[a,b].filter(s=>(s.resetAt||0)===R);
  const done={};
  for(const s of [a,b])for(const[k,v]of Object.entries(s.done||{})){if((v.last||0)<=R)continue;const c=done[k];
    done[k]=!c?v:{stars:Math.max(c.stars,v.stars),errors:(v.last>=c.last?v:c).errors,plays:Math.max(c.plays||1,v.plays||1),last:Math.max(c.last,v.last)};}
  const seen=new Set(),log=[...(a.log||[]),...(b.log||[])].filter(l=>l.at>R&&!seen.has(l.k+l.at)&&seen.add(l.k+l.at)).sort((x,y)=>y.at-x.at).slice(0,60);
  const err={},time={};
  for(const s of cur2){for(const[k,v]of Object.entries(s.err||{}))err[k]=Math.max(err[k]||0,v);for(const[k,v]of Object.entries(s.time||{}))time[k]=Math.max(time[k]||0,v);}
  return{pid:a.pid||b.pid,done,log,err,time,resetAt:R};
}
const Sync={
  state:'local',db:null,uid:null,remote:{},sent:{},timer:null,busy:false,again:false,ready:false,loadTimer:null,
  label(){return({local:IN_CLAUDE?'Só neste aparelho':'Salvo neste aparelho',connecting:'Conectando à sua conta…',saving:'Salvando na sua conta…',saved:'Salvo na sua conta Claude',offline:'Sem conexão com a conta agora. O progresso fica neste aparelho e sobe quando conectar.',error:'Não foi possível salvar na conta. O progresso continua neste aparelho.',full:'O espaço da conta para este app está cheio.'})[this.state];},
  set(s){if(this.state===s)return;this.state=s;const el=$('#sync-status');if(el)el.textContent=this.label();},
  async init(){
    try{
      if(!window.claude||!claude.use){this.set('local');return;}
      this.set('connecting');
      const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      const uid=user?await user.id():null;
      if(!db||!uid){this.set('local');quietRender();return;}
      this.db=db;this.uid=uid;
      this.loadTimer=setTimeout(()=>{if(!this.ready)this.set('offline');},10000);
      db.collection('data/users/'+uid).onSnapshot(snap=>this.onSnap(snap),()=>{this.set('offline');});
    }catch(e){this.set('local');}
  },
  onSnap(snap){
    const remote={};snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data();});
    this.remote=remote;
    const first=!this.ready&&!snap.metadata.fromCache;
    if(!snap.metadata.fromCache){this.ready=true;clearTimeout(this.loadTimer);if(['connecting','offline'].includes(this.state))this.set('saved');}
    if(this.timer||this.busy)return;                       // mudanças locais ainda subindo: a próxima leitura traz o resultado
    const fam=remote.familia;
    if(!fam){if(first)quietRender();if(this.ready&&DB.profiles.length)this.schedule(0);return;}   // primeira vez nesta conta: envia o que há no aparelho
    if(first)quietRender();
    const before=JSON.stringify(DB);
    if(fam.settings)DB.settings={...DB.settings,...fam.settings};
    const local=Object.fromEntries(DB.profiles.map(p=>[p.id,p]));
    DB.profiles=(fam.profiles||[]).map(m=>{const k=mergeKid(local[m.id]?kidOf(local[m.id]):null,remote['crianca-'+m.id]||null)||{};
      return{id:m.id,name:m.name,avatar:m.avatar,example:!!m.example,done:k.done||{},log:k.log||[],err:k.err||{},time:k.time||{},resetAt:k.resetAt||0};});
    if(JSON.stringify(DB)!==before){saveLocal();if(S.p&&!cur())S.p=null;quietRender();}
    if(this.ready&&this.pending().length)this.schedule(0); // havia progresso só neste aparelho
  },
  pending(){
    const docs=[];const f=famOf();if(canon(f)!==canon(this.remote.familia))docs.push(['familia',f]);
    DB.profiles.forEach(p=>{const id='crianca-'+p.id,k=mergeKid(kidOf(p),this.remote[id]||null);if(canon(k)!==canon(this.remote[id]))docs.push([id,k]);});
    Object.keys(this.remote).forEach(id=>{if(id.startsWith('crianca-')&&!DB.profiles.some(p=>'crianca-'+p.id===id))docs.push([id,null]);});
    return docs;
  },
  schedule(ms=800){if(!this.db||!this.ready)return;clearTimeout(this.timer);this.timer=setTimeout(()=>{this.timer=null;this.flush();},ms);},
  async flush(){
    if(this.busy){this.again=true;return;}
    const docs=this.pending();if(!docs.length){this.set('saved');return;}
    this.busy=true;this.set('saving');let failed=null;
    for(const[id,body]of docs){                               // um documento por vez
      const ref=this.db.doc('data/users/'+this.uid+'/'+id);
      try{if(body===null){await ref.delete();delete this.remote[id];}
        else{await ref.set(body);this.remote[id]=JSON.parse(JSON.stringify(body));
          if(id.startsWith('crianca-')){const p=DB.profiles.find(x=>'crianca-'+x.id===id);if(p)Object.assign(p,{done:body.done,log:body.log,err:body.err,time:body.time});}}}
      catch(e){failed=e;break;}
    }
    this.busy=false;saveLocal();
    if(failed)this.set(failed.code==='quota_exceeded'?'full':'error');else this.set('saved');
    if(this.again){this.again=false;this.schedule(400);}
  }
};

  if(['home','stage','unit','album','trophies'].includes(S.screen)&&!cur()){S.screen='profiles';}
  quiet=true;try{render();}finally{quiet=false;}}

let unlocked=false;
function go(screen,extra={}){if(G&&screen!=='game'){G.token++;G=null;}S={...S,...extra,screen};if(!['unit','game','end'].includes(screen)){S.exKey=null;S.exSom=null;}render();window.scrollTo(0,0);}

function render(){({profiles:scrProfiles,home:scrHome,stage:scrStage,unit:scrUnit,end:scrEnd,album:scrAlbum,trophies:scrTrophies,gate:scrGate,parents:scrParents})[S.screen]();}
const uvis=u=>`<span class="uv" style="--ct:var(--t-${u.stage});--cb:var(--c-${u.stage})">${u.html?u.big:esc(u.big)}</span>`;

async function setupTrace(r){

  mg.font=font;mg.textAlign='center';mg.fillStyle='#000';mg.fillText(r.ch,x,y);

  const u=cu.getContext('2d');u.setTransform(dpr,0,0,dpr,0,0);u.lineCap='round';u.lineJoin='round';u.lineWidth=size*.085;u.strokeStyle='#FF8A3D';

function traceScore(T){
  const W=T.cu.width,d=T.u.getImageData(0,0,W,W).data,k=T.dpr,r=T.size*.045;

   <div class="shadows">${r.zones.map((z,i)=>`<div class="zone" data-z="${i}" aria-label="Sombra"><span class="emo">${z[0]}</span></div>`).join('')}</div>
   <div class="dragrow">${r.items.map((it,i)=>`<div class="drag" data-d="${i}" role="button" tabindex="0" aria-label="${esc(it[1])}"><span class="emo">${it[0]}</span></div>`).join('')}</div></div>`;
  setupDrag(r);
}
function setupDrag(r){
  const tok=G.token;let drag=null,sel=null;
  const back=el=>{el.style.transition='transform .25s';el.style.transform='';setTimeout(()=>{el.style.transition='';},260);};
  const select=i=>{sel=i;$$('.drag').forEach((d,j)=>d.classList.toggle('sel',j===i));say(`${cap(r.items[i][1])}. Agora toque na sombra.`);};
  async function drop(i,zi){
    if(!G||G.token!==tok||G.busy)return;const el=$$('.drag')[i],z=$$('.zone')[zi];sel=null;$$('.drag').forEach(d=>d.classList.remove('sel'));
    if(z.classList.contains('full')){back(el);return;}
    if(r.items[i][0]===r.zones[zi][0]){z.classList.add('full');$$('.zone').forEach(x=>x.classList.remove('hint'));el.classList.add('placed');el.style.transform='';sfx('ok');burst(z);r.left--;G.roundErr=0;
      if(r.left<=0){G.busy=true;await say(`${rnd(PRAISE)} Todas as figuras acharam a sombra!`);if(!G||tok!==G.token)return;nextRound();}
      else say(`${cap(r.items[i][1])}!`);
    }else{G.errors++;G.roundErr++;sfx('no');z.classList.add('wrong');setTimeout(()=>z.classList.remove('wrong'),450);back(el);
      say('Ops! Essa sombra é de outra figura. Olhe o formato e tente outra.');
      if(G.roundErr>=2){const zj=r.zones.findIndex(x=>x[0]===r.items[i][0]);if(zj>=0)$$('.zone')[zj].classList.add('hint');}}
  }
  $$('.drag').forEach(el=>{
    el.onpointerdown=e=>{if(!G||G.busy||el.classList.contains('placed'))return;e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}
      drag={el,i:+el.dataset.d,sx:e.clientX,sy:e.clientY,moved:false};el.classList.add('lift');};
    el.onpointermove=e=>{if(!drag||drag.el!==el)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>10)drag.moved=true;
      if(drag.moved)el.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;};
    el.onpointerup=el.onpointercancel=e=>{if(!drag||drag.el!==el)return;const d=drag;drag=null;el.classList.remove('lift');
      if(!d.moved||e.type==='pointercancel'){el.style.transform='';if(e.type==='pointerup')select(d.i);return;}
      el.style.visibility='hidden';const hit=document.elementFromPoint(e.clientX,e.clientY);el.style.visibility='';
      const z=hit&&hit.closest('.zone');if(z)drop(d.i,+z.dataset.z);else back(el);};
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(+el.dataset.d);}};
  });
  $$('.zone').forEach(z=>{z.onclick=()=>{if(sel!=null)drop(sel,+z.dataset.z);else say('Arraste uma figura até a sombra dela.');};});
}
/* Estoure as bolhas */
function renderBubbles(r){
  app.innerHTML=`<div class="game" style="--ct:var(--t-pensar)">${gbar()}
   <div class="ask"><div class="ask-row">${lelo()}<div class="ask-card" style="min-width:120px;min-height:120px;padding:10px 16px">${showHtml(r.show)}</div></div>
   <div class="bcount" role="img" aria-label="Faltam ${r.n} bolhas">${'<i></i>'.repeat(r.n)}</div></div>
   <div class="pond"></div></div>`;
  runBubbles(r);
}
function runBubbles(r){
  const tok=G.token,pond=$('.pond'),B=[];let spawnT=.3,miss=0,prev=performance.now();r.got=0;r.over=false;
  function spawn(){
    const W=pond.clientWidth,H=pond.clientHeight,s=Math.round(Math.min(112,Math.max(80,W*.24)));
    const tgt=r.mode==='all'||miss>=2||Math.random()<.5;miss=tgt?0:miss+1;
    const c=r.mode==='all'?rnd(r.pool):tgt?r.target:rnd(r.others);
    const el=document.createElement('button');el.className='bub';el.style.cssText=`width:${s}px;height:${s}px;font-size:${s}px`;
    if(r.mode==='letter'){el.innerHTML=`<span class="bl">${esc(c)}</span>`;el.setAttribute('aria-label','Bolha com a letra '+c);}
    else{el.innerHTML=`<span class="emo">${c[0]}</span>`;el.setAttribute('aria-label','Bolha com '+c[1]);}
    const b={el,c,tgt,s,x:Math.random()*Math.max(0,W-s),y:H+6,vy:r.speed*(.85+Math.random()*.3),ph:Math.random()*6.3};el._b=b;
    el.style.left=b.x+'px';el.style.top=b.y+'px';pond.appendChild(el);B.push(b);}
  pond.onpointerdown=e=>{const el=e.target.closest('.bub');if(!el||!G||G.token!==tok||G.busy)return;e.preventDefault();hitBubble(r,el._b,tok);};
  function frame(t){
    if(!G||G.token!==tok||!pond.isConnected)return;const dt=Math.min(.05,(t-prev)/1000);prev=t;
    if(!r.over){spawnT-=dt;if(spawnT<=0&&B.filter(b=>!b.dead).length<r.max){spawn();spawnT=r.every;}}
    for(let i=B.length-1;i>=0;i--){const b=B[i];if(b.dead){B.splice(i,1);continue;}
      b.y-=b.vy*dt;b.ph+=dt*1.8;b.el.style.left=(b.x+Math.sin(b.ph)*10)+'px';b.el.style.top=b.y+'px';
      if(b.y<-b.s){b.el.remove();B.splice(i,1);}}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
}
async function hitBubble(r,b,tok){
  if(!b||b.dead)return;
  if(b.tgt){b.dead=true;b.el.classList.add('pop');sfx('tap');setTimeout(()=>b.el.remove(),240);r.got++;const dot=$$('.bcount i')[r.got-1];if(dot)dot.classList.add('on');
    if(r.got>=r.n){r.over=true;G.busy=true;sfx('ok');burst($('.pond'));await say(`${rnd(PRAISE)} ${r.praise}`);if(!G||tok!==G.token)return;nextRound();}
  }else{if(b.warned)return;b.warned=true;G.errors++;if(r.errLetter)bumpErr(r.errLetter);sfx('no');b.el.classList.add('no');say(r.wrongSay(b.c));}
}

/* ================= Carros e trens, Mexa o corpo: telas ================= */
/* Dirija até a garagem: a criança arrasta o carro pela estrada até a garagem certa */
function roadPts(r){const S=[.5,.9],J=[.5,.6],c=r.curve;
  const qb=(a,b,k,n)=>{const P=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;P.push([u*u*a[0]+2*u*t*k[0]+t*t*b[0],u*u*a[1]+2*u*t*k[1]+t*t*b[1]]);}return P;};
  const ends=r.n===2?[[.2,.17],[.8,.17]]:[[.15,.25],[.5,.15],[.85,.25]];
  return{trunk:qb(S,J,[.5+.22*c,.8],30),br:ends.map((E,i)=>qb(J,E,r.n===3&&i===1?[.5+.05*c,.4]:[E[0],J[1]],40)),ends};}
function renderDrive(r){
  app.innerHTML=`<div class="game" style="--ct:var(--t-pensar)">${gbar()}
   <div class="ask"><div class="ask-row">${lelo()}<div class="ask-card" style="min-width:110px;min-height:110px;padding:10px 16px">${showHtml(r.show)}</div></div><p class="ask-text">${esc(r.text)}</p></div>
   <div class="dwrap"><div class="dbox"><canvas id="dg"></canvas>${r.targets.map((t,i)=>`<button class="gar" data-g="${i}" aria-label="${esc(t.aria)}">${t.html}</button>`).join('')}<span class="car emo" id="car" role="img" aria-label="Carro">🚗</span></div></div></div>`;
  setupDrive(r);
}
function setupDrive(r){
  const tok=G.token,box=$('.dbox');
  const size=Math.floor(Math.min(box.parentElement.clientWidth,440,Math.max(240,window.innerHeight-330)));
  box.style.width=box.style.height=size+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1),cv=$('#dg');cv.width=cv.height=Math.round(size*dpr);
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.lineCap=g.lineJoin='round';
  const R=roadPts(r),all=[R.trunk,...R.br];
  const line=(P,w,col,dash)=>{g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0]*size,p[1]*size):g.moveTo(p[0]*size,p[1]*size));g.lineWidth=w;g.strokeStyle=col;g.setLineDash(dash||[]);g.stroke();};
  all.forEach(P=>line(P,size*.17,'#7D8B99'));all.forEach(P=>line(P,size*.145,'#A9B4C0'));
  all.forEach(P=>line(P,Math.max(2,size*.012),'#fff',[size*.03,size*.03]));
  const PTS=[];R.trunk.forEach((p,t)=>PTS.push({p,b:-1,t}));R.br.forEach((P,b)=>P.forEach((p,t)=>PTS.push({p,b,t})));
  const car=$('#car'),gars=$$('.gar');car.style.fontSize=Math.round(size*.15)+'px';
  gars.forEach((el,i)=>{const E=R.ends[i];el.style.left=E[0]*100+'%';el.style.top=E[1]*100+'%';el.style.fontSize=Math.round(size*.1)+'px';});
  let cp=PTS[0],face=1,drag=false,done=false;
  const put=(q,anim)=>{cp=q;car.style.transition=anim?'left .5s,top .5s':'none';car.style.left=q.p[0]*100+'%';car.style.top=q.p[1]*100+'%';car.style.transform=`translate(-50%,-62%) scaleX(${face})`;};
  put(cp);
  const pos=e=>{const b=box.getBoundingClientRect();return[(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height];};
  box.onpointerdown=e=>{if(!G||G.token!==tok||G.busy||done)return;
    const ge=e.target.closest('.gar');if(ge){say(r.targets[+ge.dataset.g].say);return;}
    const f=pos(e);
    if(Math.hypot(f[0]-cp.p[0],f[1]-cp.p[1])>.17){car.classList.add('nudge');setTimeout(()=>car.classList.remove('nudge'),900);say('Coloque o dedo no carro e arraste pela estrada.');return;}
    e.preventDefault();try{box.setPointerCapture(e.pointerId);}catch(_){}drag=true;sfx('vrum');};
  box.onpointermove=e=>{if(!drag)return;const f=pos(e);let best=null,bd=1e9;
    for(const q of PTS){const d=Math.hypot(q.p[0]-f[0],q.p[1]-f[1]);if(d<bd){bd=d;best=q;}}
    if(!best||bd>.13||Math.hypot(best.p[0]-cp.p[0],best.p[1]-cp.p[1])>.16)return;
    const dx=best.p[0]-cp.p[0];if(Math.abs(dx)>.004)face=dx>0?-1:1;put(best);
    if(best.b>=0&&best.t>=R.br[best.b].length-3){drag=false;arrive(best.b);}};
  box.onpointerup=box.onpointercancel=()=>{drag=false;};
  async function arrive(b){
    if(!G||G.token!==tok)return;
    if(b===r.answer){done=true;G.busy=true;sfx('beep');gars[b].classList.add('ok');burst(gars[b]);await say(`${rnd(PRAISE)} ${r.praise}`);if(!G||tok!==G.token)return;nextRound();}
    else{G.errors++;G.roundErr++;if(r.errLetter)bumpErr(r.errLetter);sfx('no');gars[b].classList.add('wrong');setTimeout(()=>gars[b].classList.remove('wrong'),450);
      say(r.wrongSay(r.targets[b]));
      const j=PTS.find(q=>q.b===-1&&q.t===R.trunk.length-1);setTimeout(()=>{if(G&&G.token===tok)put(j,true);},350);
      if(G.roundErr>=2)gars[r.answer].classList.add('hint');}
  }
}
/* Corrida das estrelas: o carro troca de pista e pega o que é pedido */
function renderLanes(r){
  app.innerHTML=`<div class="game" style="--ct:var(--t-pensar)">${gbar()}
   <div class="ask"><div class="ask-row">${lelo()}<div class="ask-card" style="min-width:110px;min-height:110px;padding:10px 16px">${showHtml(r.show)}</div></div>
   <div class="bcount" role="img" aria-label="Pegue ${r.n}">${'<i></i>'.repeat(r.n)}</div></div>
   <div class="lanes"><span class="lcar emo" role="img" aria-label="Carro">🚗</span></div></div>`;
  runLanes(r);
}
function runLanes(r){
  const tok=G.token,box=$('.lanes'),car=$('.lcar'),I=[];let lane=1,spawnT=.6,miss=0,prev=performance.now(),off=0,down=false;r.got=0;r.over=false;
  const geo=()=>{const W=box.clientWidth,H=box.clientHeight,lh=H/3,s=Math.round(Math.min(lh*.74,96));return{W,H,lh,s};};
  const place=()=>{const{lh,s}=geo();car.style.width=car.style.height=s+'px';car.style.fontSize=Math.round(s*.8)+'px';car.style.top=(lane*lh+lh/2-s/2)+'px';};
  place();
  const setLane=l=>{l=Math.max(0,Math.min(2,l));if(l!==lane){lane=l;place();sfx('tap');}};r.setLane=setLane;
  const laneAt=e=>{const b=box.getBoundingClientRect();return Math.floor((e.clientY-b.top)/(b.height/3));};
  box.onpointerdown=e=>{if(!G||G.token!==tok||G.busy)return;e.preventDefault();down=true;try{box.setPointerCapture(e.pointerId);}catch(_){}setLane(laneAt(e));};
  box.onpointermove=e=>{if(down)setLane(laneAt(e));};
  box.onpointerup=box.onpointercancel=()=>{down=false;};
  function spawn(){const{W,lh,s}=geo();
    const tgt=r.mode==='all'||miss>=2||Math.random()<.55;miss=tgt?0:miss+1;
    const c=tgt?r.target:rnd(r.others),l=Math.floor(Math.random()*3);
    const el=document.createElement('div');el.className='litem';el.style.cssText=`width:${s}px;height:${s}px;top:${l*lh+lh/2-s/2}px;font-size:${s}px`;
    if(r.mode==='letter'){el.innerHTML=`<span class="bl">${esc(c)}</span>`;}else el.innerHTML=`<span class="emo">${c[0]}</span>`;
    const it={el,c,tgt,l,x:W+4,s};el.style.left=it.x+'px';box.appendChild(el);I.push(it);}
  function frame(t){
    if(!G||G.token!==tok||!box.isConnected)return;const dt=Math.min(.05,(t-prev)/1000);prev=t;const{W}=geo();
    off=(off+dt*W*r.speed*1.4)%60;box.style.backgroundPositionX=(-off)+'px';
    if(!r.over){spawnT-=dt;if(spawnT<=0){spawn();spawnT=r.every;}}
    const cx=car.offsetLeft,cw=car.offsetWidth;
    for(let i=I.length-1;i>=0;i--){const it=I[i];it.x-=W*r.speed*dt;it.el.style.left=it.x+'px';
      if(!it.hit&&!r.over&&it.l===lane&&it.x<cx+cw*.75&&it.x+it.s>cx+cw*.25)hitItem(r,it,tok);
      if(it.x<-it.s-10){it.el.remove();I.splice(i,1);}}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
}
async function hitItem(r,it,tok){it.hit=true;
  if(it.tgt){it.el.classList.add('pop');sfx('tap');setTimeout(()=>it.el.remove(),240);r.got++;const dot=$$('.bcount i')[r.got-1];if(dot)dot.classList.add('on');
    if(r.got>=r.n){r.over=true;G.busy=true;sfx('ok');burst($('.lcar'));await say(`${rnd(PRAISE)} ${r.praise}`);if(!G||tok!==G.token)return;nextRound();}}
  else{G.errors++;if(r.errLetter)bumpErr(r.errLetter);sfx('no');const car=$('.lcar');if(car){car.classList.add('bump');setTimeout(()=>car.classList.remove('bump'),450);}it.el.classList.add('no');say(r.wrongSay(it.c));}
}

/* Mexa o corpo: cada movimento tem uma animação, um tempo ajustável (Área dos pais) e uma música */
const mcount=()=>'<div class="mcount"><svg class="mring" viewBox="0 0 40 40" aria-hidden="true"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" cx="20" cy="20" r="16" pathLength="100"/></svg><b class="mnum"></b></div>';

   <div class="mstage m-${anim}${r.left?' fig-left':''}"><i class="cl c1"></i><i class="cl c2"></i>${anim==='fly'||anim==='letter'||anim==='clap'?'':'<div class="mground"></div>'}${inner}${mcount()}</div>

function mScale(){const st=$('.mstage');if(!st)return;const k=Math.min(st.clientWidth,st.clientHeight)*.74/100;$$('.ldraw,.fpath').forEach(el=>el.style.transform=`translate(-50%,-50%) scale(${k})`);}
const mWaitTalk=async live=>{const w=ms=>new Promise(res=>setTimeout(res,ms));await w(400);const t0=Date.now();while(live()&&talking&&Date.now()-t0<15000)await w(150);};
async function runBody(r){
  const tok=G.token,live=()=>G&&G.token===tok,wait=ms=>new Promise(res=>setTimeout(res,ms)),D=bodyDur();
  const st=$('.mstage'),num=$('.mnum'),fg=$('.mring .fg');mScale();
  const retrig=el=>{if(!el)return;el.classList.remove('beat');void el.offsetWidth;el.classList.add('beat');};
  const beat=()=>{retrig($('.mfig'));retrig($('.mshadow'));$$('.mpuff').forEach(retrig);retrig($('.mrip'));if(r.anim==='stomp'){st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake');}};
  const ring=(f,secs)=>{fg.style.transition=secs?`stroke-dashoffset ${secs}s linear`:'stroke-dashoffset .3s';fg.style.strokeDashoffset=String(100-100*f);};
  const pop=v=>{num.textContent=v;num.classList.remove('pop');void num.offsetWidth;num.classList.add('pop');};
  const song=r.syls?null:r.L?'danca':r.song;if(song)Music.play(song);
  await mWaitTalk(live);if(!live())return;
  st.classList.add('run');
  if(r.syls){const reps=D.reps<=5?2:D.reps<=10?3:4,marks=$$('.claps span');
    for(let n=0;n<reps;n++){if(!live())return;
      if(n>0){marks.forEach(m=>m.classList.remove('on'));await say(n===reps-1?'Mais uma vez!':'De novo!');if(!live())return;await wait(300);}
      for(let i=0;i<r.syls.length;i++){if(!live())return;marks[i].classList.add('on');beat();sfx('clap');pop(n+1);await say(sp(r.syls[i])+'!');if(!live())return;await wait(350);}
      ring((n+1)/reps);await wait(500);}
  }else if(r.count){const reps=D.reps;
    for(let i=1;i<=reps;i++){if(!live())return;beat();pop(i);ring(i/reps);if(r.anim!=='stomp')sfx('tap');
      await say(r.word||cap(NUMS[i-1])+'!');if(!live())return;await wait(r.anim==='stomp'?300:450);
      if(reps>=8&&i===Math.floor(reps/2)){await say(rnd(['Isso! Continue!','Muito bem! Falta pouco!']));if(!live())return;}}
  }else{const secs=D.secs;let ci=0;ring(1);await wait(40);ring(0,secs);
    for(let s=secs;s>0;s--){if(!live())return;num.textContent=s;const el=secs-s;
      if(s<=3)say(cap(NUMS[s-1])+'!');
      else if(el>0&&r.cues&&el%(r.cueEvery||5)===0)say(r.cues[ci++%r.cues.length]);
      else if(!r.cues&&s===Math.ceil(secs/2))say(rnd(['Isso! Continue!','Muito bem! Falta pouco!']));
      await wait(1000);}

function renderClean(r){const p=r.phases[0];r.ph=0;r.prompt=p.say;
  app.innerHTML=`<div class="game" style="--ct:var(--t-cuidar)">${gbar()}${talkHead(p.say)}

   <div class="dock"><button class="dtool" data-action="toolHear" aria-label="${esc(p.tool[1])}"><span class="emo">${p.tool[0]}</span></button></div></div>`;
  setupClean(r);

function setupClean(r){
  const tok=G.token,sc=$('.scene'),wrap=$('.cwrap');
  const S=Math.floor(Math.min(wrap.clientWidth,420,Math.max(220,window.innerHeight-$('.game .ask').getBoundingClientRect().bottom-136)));
  sc.style.width=sc.style.height=S+'px';$('.hfig').style.fontSize=Math.round(S*.72)+'px';
  const els=$$('.spot'),d=Math.round(S*(r.sz||.17)),tool=$('.tool');tool.style.fontSize=Math.round(S*.2)+'px';
  const setType=(h,t)=>{h.type=t;h.hp=100;h.el.className='spot '+(t||'gone');h.el.style.opacity='';
    h.el.innerHTML=t==='germ'?'<span class="emo">🦠</span>':t==='drop'?'<span class="emo">💧</span>':'';};
  const H=r.spots.map(([x,y],i)=>({x:(.07+.86*x)*S,y:(.07+.86*y)*S,el:els[i]}));
  H.forEach(h=>{h.el.style.cssText=`left:${h.x}px;top:${h.y}px;width:${d}px;height:${d}px;font-size:${Math.round(d*.7)}px`;setType(h,r.phases[0].from);});
  let down=false,last=null,lastSnd=0;G.clean={H,S,d};
  const pt=e=>{const b=sc.getBoundingClientRect();return[(e.clientX-b.left)*S/b.width,(e.clientY-b.top)*S/b.height];};
  const showTool=p=>{tool.hidden=false;tool.style.left=p[0]+'px';tool.style.top=p[1]+'px';};
  sc.onpointerdown=e=>{if(!G||G.token!==tok||G.busy)return;e.preventDefault();try{sc.setPointerCapture(e.pointerId);}catch(_){}down=true;last=pt(e);showTool(last);};
  sc.onpointermove=e=>{if(!down||!G||G.token!==tok||G.busy)return;const p=pt(e),mv=Math.hypot(p[0]-last[0],p[1]-last[1]);last=p;showTool(p);if(mv<.5)return;
    const ph=r.phases[r.ph];let hit=false;
    for(const h of H){if(h.type!==ph.from||Math.hypot(p[0]-h.x,p[1]-h.y)>d*.8)continue;hit=true;
      h.hp-=mv/S*330;h.el.style.opacity=String(.3+.7*Math.max(0,h.hp)/100);
      if(h.hp<=0){setType(h,ph.to);if(ph.to)h.el.classList.add('pop');sfx('tap');}}
    const now=performance.now();if(hit&&now-lastSnd>140){lastSnd=now;sfx('scrub');}
    if(!H.some(h=>h.type===ph.from))phaseDone();};
  sc.onpointerup=sc.onpointercancel=()=>{down=false;tool.hidden=true;};
  async function phaseDone(){
    down=false;tool.hidden=true;
    if(r.ph+1<r.phases.length){r.ph++;const p=r.phases[r.ph];r.prompt=p.say;
      tool.innerHTML=`<span class="emo">${p.tool[0]}</span>`;const dt=$('.dtool');dt.innerHTML=`<span class="emo">${p.tool[0]}</span>`;dt.setAttribute('aria-label',p.tool[1]);
      $('.ask-text').textContent=p.say;sfx('ok');say(p.say);}
    else{G.busy=true;sc.classList.add('shine');sfx('ok');burst(sc);await say(`${rnd(PRAISE)} ${r.praise}`);if(!G||tok!==G.token)return;nextRound();}
  }
}

/* Quebra-cabeças: arrastar a peça até o lugar (ou tocar na peça e depois no lugar) */
const PZ_SC={4:.5,6:.56,9:.58};
function pzFig(r,S){return r.kind==='letter'?`<span class="pzl" style="font-size:${Math.round(S*1.05)}px">${esc(r.item)}</span>`
  :`<span class="emo pzf" style="width:${Math.round(S*.86)}px;height:${Math.round(S*.86)}px;font-size:${Math.round(S*.72)}px">${r.item[0]}</span>`;}
function renderPuzzle(r){app.innerHTML=`<div class="game" style="--ct:var(--t-quebra)">${gbar()}${talkHead(r.text)}<div class="pz"></div></div>`;setupPuzzle(r);}
function setupPuzzle(r){
  const tok=G.token,pz=$('.pz'),[C,R]=r.grid,n=C*R,W=pz.clientWidth,gap=8,sc=PZ_SC[n];
  const avail=window.innerHeight-$('.game .ask').getBoundingClientRect().bottom-26;
  let S=Math.min(W,380),cw,ch,k,trayH;
  for(;;S-=8){cw=S/C;ch=S/R;k=Math.max(1,Math.floor((W+gap)/(cw*sc+gap)));trayH=Math.ceil(n/k)*(ch*sc+gap);if(S+12+trayH<=avail||S<=200)break;}
  pz.style.height=Math.ceil(S+12+trayH)+'px';const bx=(W-S)/2;
  pz.innerHTML=`<div class="pzb" style="left:${bx}px;width:${S}px;height:${S}px"><div class="pzi pzg" style="left:0;top:0;width:${S}px;height:${S}px">${pzFig(r,S)}</div>`+
    [...Array(n).keys()].map(i=>`<div class="pzc" data-c="${i}" style="left:${i%C*cw}px;top:${Math.floor(i/C)*ch}px;width:${cw}px;height:${ch}px"></div>`).join('')+'</div>'+
    r.order.map((i,j)=>`<div class="pzp" data-p="${i}" role="button" tabindex="0" aria-label="Peça ${j+1}" style="width:${cw}px;height:${ch}px"><div class="pzi" style="left:${-(i%C)*cw}px;top:${-Math.floor(i/C)*ch}px;width:${S}px;height:${S}px">${pzFig(r,S)}</div></div>`).join('');
  const P=r.order.map((i,j)=>({i,j,el:pz.querySelector(`.pzp[data-p="${i}"]`),placed:false}));
  const rowW=Math.min(k,n)*(cw*sc+gap)-gap,x0=(W-rowW)/2;
  const home=p=>{p.el.style.left=(x0+(p.j%k)*(cw*sc+gap))+'px';p.el.style.top=(S+12+Math.floor(p.j/k)*(ch*sc+gap))+'px';p.el.style.transform=`scale(${sc})`;};
  P.forEach(home);
  let sel=null,drag=null;r.left=n;
  const select=p=>{sel=p;P.forEach(q=>q.el.classList.toggle('sel',q===p));if(p){sfx('tap');say('Agora toque no lugar dessa peça.');}};
  async function drop(p,cell){
    sel=null;P.forEach(q=>q.el.classList.remove('sel'));
    if(cell<0||P.some(q=>q.placed&&q.i===cell)){home(p);return;}
    if(cell===p.i){p.placed=true;p.el.style.left=(bx+(cell%C)*cw)+'px';p.el.style.top=(Math.floor(cell/C)*ch)+'px';p.el.style.transform='none';p.el.classList.add('placed');
      $$('.pzc').forEach(c=>c.classList.remove('hint'));sfx('tap');r.left--;G.roundErr=0;
      if(r.left<=0){G.busy=true;$('.pzb').classList.add('done');sfx('ok');burst($('.pzb'));await say(`${rnd(PRAISE)} ${r.praise}`);if(!G||tok!==G.token)return;nextRound();}}
    else{G.errors++;G.roundErr++;if(r.errLetter)bumpErr(r.errLetter);sfx('no');const c=$$('.pzc')[cell];c.classList.add('wrong');setTimeout(()=>c.classList.remove('wrong'),450);home(p);
      say('Essa peça não é daí. Olhe o desenho clarinho e tente outro lugar.');
      if(G.roundErr>=2)$$('.pzc')[p.i].classList.add('hint');}
  }
  const local=e=>{const b=pz.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
  P.forEach(p=>{const el=p.el;
    el.onpointerdown=e=>{if(!G||G.token!==tok||G.busy||p.placed)return;e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}
      const rc=el.getBoundingClientRect();drag={p,fx:(e.clientX-rc.left)/rc.width,fy:(e.clientY-rc.top)/rc.height,sx:e.clientX,sy:e.clientY,moved:false};};
    el.onpointermove=e=>{if(!drag||drag.p!==p)return;if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8)return;
      if(!drag.moved){drag.moved=true;el.classList.add('drag');el.style.transform='none';}
      const[x,y]=local(e);el.style.left=(x-drag.fx*cw)+'px';el.style.top=(y-drag.fy*ch)+'px';};
    el.onpointerup=el.onpointercancel=e=>{if(!drag||drag.p!==p)return;const d=drag;drag=null;el.classList.remove('drag');
      if(!d.moved){if(e.type==='pointerup')select(sel===p?null:p);return;}
      const[x,y]=local(e),cx=x-d.fx*cw+cw/2-bx,cy=y-d.fy*ch+ch/2;
      drop(p,cx>=0&&cx<S&&cy>=0&&cy<S?Math.floor(cx/cw)+C*Math.floor(cy/ch):-1);};
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p);}};
  });
  $$('.pzc').forEach(c=>{c.onclick=()=>{if(!G||G.token!==tok||G.busy)return;if(sel)drop(sel,+c.dataset.c);else say('Arraste uma peça até aqui.');};});
  G.pz={P,drop,geo:{S,cw,ch,bx}};
}
