<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="App gratuito para crianças aprenderem a ler brincando, com narração em todas as telas: letras, traçado, sons, sílabas e leitura.">
<meta name="theme-color" content="#DFF3EE">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2230%22%20r%3D%2211%22%20fill%3D%22%236BC27A%22%2F%3E%3Cpath%20d%3D%22M4%2044Q4%2012%2030%2012Q54%2012%2054%2044Z%22%20fill%3D%22%232E9E6A%22%2F%3E%3Cpath%20d%3D%22M4%2044h50%22%20stroke%3D%22%23FFC93C%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2253%22%20cy%3D%2227%22%20r%3D%222.5%22%20fill%3D%22%231F3640%22%2F%3E%3C%2Fsvg%3E">
<title>Trilha do Lelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: uma coluna de app (máx. 760px); nos jogos, a pergunta fica no alto e as respostas ficam embaixo, perto do polegar.
   Visual único e claro de propósito (app infantil), sem tema escuro. */
:root{
  --sky:#DFF3EE; --sky-2:#C6E8DF; --paper:#FFFFFF; --ink:#1F3640; --ink-soft:#4E6A73; --line:#BBDDD3;
  --go:#138A7E; --go-deep:#0B5F56; --sun:#FFC93C; --sun-deep:#C98F00; --tang:#FF8A3D;
  --coral:#E4574C; --coral-soft:#FDE4E1; --ok:#1E9E5A; --ok-soft:#D6F4E4;
  --c-letras:#FF8A3D; --c-tracar:#FFC93C; --c-sons:#2F8FD8; --c-silabas:#E5487A; --c-ler:#2E9E6A; --c-pensar:#8B5CF6;
  --t-letras:#D9601A; --t-tracar:#A97400; --t-sons:#1C6BAE; --t-silabas:#C22F62; --t-ler:#1F7A50; --t-pensar:#6A3BD1;
  --f-kid:'Andika','Comic Sans MS','Trebuchet MS',sans-serif;
  --f-ui:'Fredoka','Andika','Trebuchet MS',system-ui,sans-serif;
  --f-emo:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-ui);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sky);z-index:10}
#app{min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:4px solid var(--tang);outline-offset:3px;border-radius:16px}
h1,h2,p{margin:0}
.emo{font-family:var(--f-emo);line-height:1;font-weight:400}
.e3d{display:inline-block;width:1.18em;height:1.18em;vertical-align:-.2em;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-select:none}
.e3d+.e3d{margin-left:.04em}
.k{font-family:var(--f-kid);font-weight:700}

.shell{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px;min-height:76px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--sky);z-index:5;padding-block:10px}
.grow{flex:1}
.ibtn{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 4px 0 var(--line);font-size:26px}
.ibtn svg,.hold svg{width:1em;height:1em}
.ibtn.big{width:60px;height:60px;font-size:30px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep)}
.ibtn.ghost{background:transparent;box-shadow:none;color:var(--ink-soft);width:48px;height:48px;font-size:22px}
.ibtn:active,.cta:active,.btn2:active,.st:active,.ut:active,.actb:active,.kid:active,.resume:active,.xcard:active,.chip:active{transform:translateY(3px)}
.ttl{font-size:21px;font-weight:600;line-height:1.15;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:5px 14px 5px 5px;min-height:52px;box-shadow:0 4px 0 var(--line);font-weight:600;font-size:18px;max-width:46vw}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.stars{padding:5px 14px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.stars svg{width:26px;height:26px;color:var(--sun)}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--sky-2);display:grid;place-items:center;font-size:26px}
.sec{font-size:20px;font-weight:600;margin-top:4px}

/* Lelo */
.lelo{display:block;height:auto;flex:none}
.lelo .mouth{transform-box:fill-box;transform-origin:center}
.lelo .head{transform-box:fill-box;transform-origin:20% 90%}
.lelo.talk .mouth{animation:talk .2s ease-in-out infinite alternate}
.lelo.talk .head{animation:nod 1s ease-in-out infinite}
@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(2.4)}}
@keyframes nod{50%{transform:rotate(-5deg)}}

/* Início */
.hero{background:var(--paper);border-radius:28px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 14px;align-items:center;box-shadow:0 6px 0 var(--line)}
.hero .lelo{width:118px}
.bubble{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:20px;padding:10px 12px;position:relative;min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);border:12px solid transparent;border-left:0;border-right-color:var(--sky)}
.nx-txt{display:flex;flex-direction:column;min-width:0}
.nx-txt small{font-size:14px;color:var(--ink-soft)}
.nx-txt strong{font-family:var(--f-kid);font-size:22px;line-height:1.15}
.nx-txt span{font-size:14px;color:var(--ink-soft)}
.uv{flex:none;min-width:64px;height:64px;padding:0 8px;border-radius:16px;background:var(--paper);display:grid;place-items:center;font-family:var(--f-kid);font-weight:700;font-size:32px;color:var(--ct,var(--ink));box-shadow:inset 0 0 0 3px var(--cb,var(--line))}
.uv .emo{font-size:36px}
.cta{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--go);color:#fff;font-size:26px;font-weight:700;min-height:76px;border-radius:24px;box-shadow:0 7px 0 var(--go-deep);padding:0 18px}
.cta svg{width:32px;height:32px;flex:none}
.novoice{background:var(--coral-soft);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:16px}

.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.st{grid-column:span 2;position:relative;background:var(--paper);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:0 6px 0 var(--c);border:3px solid var(--c)}
.st-ico{height:86px;border-radius:16px;background:var(--c);color:var(--on);display:grid;place-items:center;font-family:var(--f-kid);font-size:50px;font-weight:700}
.st-ico .emo{font-size:52px}
.st-name{font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
.bar{display:block;height:12px;background:var(--sky);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--go));border-radius:99px}
.st-num{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.flag{position:absolute;top:-12px;left:12px;background:var(--sun);color:var(--ink);font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;box-shadow:0 2px 0 var(--sun-deep);display:inline-flex;gap:4px;align-items:center;z-index:1}
.flag svg{width:14px;height:14px}
.extras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.xcard{background:var(--paper);border-radius:24px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 0 var(--line);min-height:96px;text-align:left}
.xcard .emo{font-size:44px}
.xcard b{display:block;font-size:18px}
.xcard span.n{color:var(--ink-soft);font-size:14px;font-variant-numeric:tabular-nums}

/* Etapa e unidade */
.sprog{display:flex;flex-direction:column;gap:6px}
.sprog .bar{background:var(--paper)}
.sprog span{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.resume{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:24px;padding:12px;border:3px solid var(--go);box-shadow:0 6px 0 var(--go-deep);text-align:left}
.resume small{display:block;font-size:14px;color:var(--ink-soft)}
.resume strong{font-family:var(--f-kid);font-size:22px}
.playdot{flex:none;margin-left:auto;width:58px;height:58px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;font-size:26px}
.playdot svg{width:1em;height:1em}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px}
.ut{position:relative;background:var(--paper);border-radius:22px;padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 0 var(--line);border:3px solid transparent}
.ut.rec{border-color:var(--sun);box-shadow:0 5px 0 var(--sun-deep)}
.ut.done{background:var(--ok-soft)}
.ut-big{font-family:var(--f-kid);font-weight:700;font-size:42px;line-height:1;color:var(--ct)}
.ut-big .emo{font-size:44px}
.ut-cap{font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.2;padding:0 2px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--sky-2)}
.dots i.on{background:var(--go)}
.badge-ok{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;font-size:16px}
.badge-ok svg{width:1em;height:1em}
.ucard{background:var(--paper);border-radius:28px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 14px;box-shadow:0 6px 0 var(--line)}
.ubig{font-family:var(--f-kid);font-size:clamp(76px,22vw,130px);font-weight:700;line-height:1;color:var(--ct)}
.ubig .emo{font-size:.8em}
.upic{font-size:76px;text-align:center}
.ucap{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-family:var(--f-kid);font-size:24px;font-weight:700}
.acts{display:flex;flex-direction:column;gap:14px}
.actb{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:22px;padding:12px;min-height:86px;box-shadow:0 5px 0 var(--line);text-align:left}
.actb.rec{box-shadow:0 5px 0 var(--sun-deep);outline:3px solid var(--sun);outline-offset:-3px}
.actico{flex:none;width:62px;height:62px;border-radius:16px;background:var(--sky);display:grid;place-items:center;font-size:32px;font-family:var(--f-kid);font-weight:700;color:var(--ct)}
.actname{font-size:20px;font-weight:600;flex:1;min-width:0;line-height:1.2}
.stars3{display:inline-flex;gap:2px;flex:none}
.stars3 svg{width:22px;height:22px;color:var(--sky-2)}
.stars3 .on svg{color:var(--sun)}

/* Jogo */
.game{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px max(16px,env(safe-area-inset-bottom,0px))}
#app:has(.game){height:100%}
.gbar{display:flex;align-items:center;gap:12px;min-height:68px}
.hold{flex:none;position:relative;width:56px;height:56px;border-radius:50%;background:var(--paper);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:26px;touch-action:none;user-select:none;-webkit-user-select:none}
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
.hold::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--tang) var(--p),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));pointer-events:none}
.hold.holding::after{animation:fill .9s linear forwards}
@keyframes fill{to{--p:100%}}
.rdots{flex:1;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.rdots i{width:15px;height:15px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.rdots i.on{background:var(--go);box-shadow:none}
.rdots i.cur{background:var(--sun);box-shadow:none;transform:scale(1.3)}
.ask{display:flex;flex-direction:column;align-items:center;gap:10px}
.ask-row{display:flex;align-items:center;gap:8px;max-width:100%}
.ask-row .lelo{width:82px}
.ask-card{background:var(--paper);border-radius:28px;padding:16px 22px;min-width:150px;min-height:150px;display:grid;place-items:center;box-shadow:0 6px 0 var(--line);max-width:100%}
.ask-card.build{display:flex;flex-direction:column;align-items:center;gap:12px}
.ask-text{font-size:15px;color:var(--ink-soft);text-align:center}
.showglyph{font-family:var(--f-kid);font-weight:700;font-size:112px;line-height:1;color:var(--ct)}
.earbtn{width:118px;height:118px;border-radius:50%;background:var(--sun);box-shadow:0 6px 0 var(--sun-deep);font-size:58px;display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite}
.earbtn svg{width:1em;height:1em}
.picbtn{position:relative;display:grid;place-items:center;padding:4px}
.picbtn .emo{font-size:100px}
.spk-badge{position:absolute;right:-12px;bottom:-6px;width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 var(--sun-deep)}
.spk-badge svg{width:1em;height:1em}
.showword{font-family:var(--f-kid);font-weight:700;font-size:clamp(46px,13vw,86px);letter-spacing:.08em;line-height:1.1;color:var(--ct)}
.sentence{font-family:var(--f-kid);font-weight:700;font-size:clamp(28px,7.4vw,44px);line-height:1.4;text-align:center;max-width:16ch;text-wrap:balance}
.sentence span{border-radius:10px;padding:0 4px;transition:background .12s}
.sentence span.on{background:var(--sun)}
.answers{margin-top:auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;padding-top:8px}
.answers.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.optw{position:relative;min-width:0}
.opt{width:100%;background:var(--paper);border-radius:24px;display:grid;place-items:center;aspect-ratio:1;max-height:170px;box-shadow:0 7px 0 var(--line);border:4px solid transparent;transition:transform .1s,opacity .2s;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.glyph{font-family:var(--f-kid);font-weight:700;font-size:clamp(50px,15vw,90px);line-height:1}
.opt .emo{font-size:clamp(50px,14vw,82px)}
.opt.pair .emo{font-size:clamp(34px,9vw,58px);letter-spacing:-.05em}
.syl{font-family:var(--f-kid);font-weight:700;font-size:clamp(32px,10vw,54px);letter-spacing:.03em}
.opt.k-word{aspect-ratio:auto;min-height:100px}
.word{font-family:var(--f-kid);font-weight:700;font-size:clamp(21px,6vw,34px);letter-spacing:.06em}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{animation:shake .45s;border-color:var(--coral);background:var(--coral-soft)}
.opt.off{opacity:.3;pointer-events:none}
.opt.used{opacity:.2;pointer-events:none}
.opt.hint{border-color:var(--sun);animation:glow 1s ease-in-out infinite}
.mini{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 var(--sun-deep);z-index:1}
.mini svg{width:1em;height:1em}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot{min-width:74px;height:74px;padding:0 8px;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center;font-family:var(--f-kid);font-weight:700;font-size:34px}
.slot.full{border-style:solid;border-color:var(--go);background:var(--ok-soft)}
.trace-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:auto;width:100%}
.tbox{position:relative;background:var(--paper);border-radius:28px;box-shadow:0 6px 0 var(--line);width:100%;max-width:440px;aspect-ratio:1}
.tbox canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:28px}
#cu{touch-action:none;cursor:crosshair}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px}
.btn2{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper);min-height:64px;border-radius:22px;box-shadow:0 5px 0 var(--line);font-size:20px;font-weight:600;padding:0 14px}
.btn2 svg{width:26px;height:26px;flex:none}
.cta.sm{min-height:64px;font-size:21px;grid-column:auto}
.cf{position:fixed;width:11px;height:11px;border-radius:3px;pointer-events:none;z-index:50;animation:cf .8s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(280deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes glow{50%{box-shadow:0 7px 0 var(--sun-deep),0 0 0 9px rgba(255,201,60,.5)}}
@keyframes pulse{50%{transform:scale(1.06)}}

/* Fim */
.endcard{background:var(--paper);border-radius:32px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 6px 0 var(--line);margin-top:20px}
.endcard .lelo{width:150px}
.endcard h1{font-size:30px;text-align:center}
.bigstars{display:flex;gap:10px}
.bs svg{width:70px;height:70px;color:var(--sky-2)}
.bs.on svg{color:var(--sun)}
.bs.on{animation:pop .5s var(--d) both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.newst{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:20px;padding:10px 16px;font-size:18px;font-weight:600}
.newst .emo{font-size:54px;animation:pop .6s .8s both}
.endbtns{display:grid;gap:14px;width:100%;max-width:440px}
.endbtns .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Perfis */
.center{align-items:center;text-align:center}
.center .lelo{width:170px}
.hello{font-size:32px;font-weight:700}
.kids{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.kid{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border-radius:28px;padding:18px 22px;min-width:140px;box-shadow:0 6px 0 var(--line)}
.av.xl{width:96px;height:96px;font-size:60px}
.kname{font-family:var(--f-kid);font-size:24px;font-weight:700}
.link{display:inline-flex;gap:8px;align-items:center;color:var(--ink-soft);font-size:16px;min-height:48px;padding:0 14px;border-radius:12px}
.link svg{width:18px;height:18px}

/* Álbum e conquistas */
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.stk{aspect-ratio:1;background:var(--paper);border-radius:18px;display:grid;place-items:center;box-shadow:0 4px 0 var(--line)}
.stk .emo{font-size:40px}
.stk:not(.on){background:transparent;box-shadow:inset 0 0 0 3px var(--sky-2)}
.stk:not(.on) .emo{filter:brightness(0);opacity:.13}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tro{background:var(--paper);border-radius:24px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 0 var(--line);text-align:center}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:40px}

  if(kind==='zigue')return[[.12,.36],[.31,.64],[.5,.36],[.69,.64],[.88,.36]];
  return P;}

const Voice={list:[],v:null,ok:false,checked:false,supported:'speechSynthesis' in window};
function pickVoice(){
  if(!Voice.supported)return;
  const all=speechSynthesis.getVoices()||[];
  Voice.list=all.filter(v=>/^pt/i.test(v.lang));
  let v=Voice.list.find(v=>v.voiceURI===DB.settings.voice);
  if(!v){const br=Voice.list.filter(v=>/pt[-_]BR/i.test(v.lang));
    v=br.find(v=>/natural|online|google|francisca|luciana|thalita|camila|vitoria/i.test(v.name))||br[0]||Voice.list[0]||null;}
  Voice.v=v;Voice.ok=!!v;if(all.length)Voice.checked=true;
}
if(Voice.supported){pickVoice();speechSynthesis.onvoiceschanged=()=>{const was=Voice.ok;pickVoice();if(was!==Voice.ok&&['home','parents'].includes(S.screen))render();};
  setTimeout(()=>{Voice.checked=true;pickVoice();if(!Voice.ok&&S.screen==='home')render();},1500);}
let talking=false,speakId=0;
function setTalking(on){talking=on;$$('.lelo').forEach(l=>l.classList.toggle('talk',on));}
function say(text,opts={}){
  return new Promise(res=>{
    const id=++speakId;
    const done=()=>{if(id===speakId)setTalking(false);res();};
    if(!text){res();return;}
    setTalking(true);
    if(!Voice.supported){setTimeout(done,Math.min(2600,text.length*55));return;}
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang=Voice.v?Voice.v.lang:'pt-BR';if(Voice.v)u.voice=Voice.v;
      u.rate=DB.settings.rate;u.pitch=1.08;
      let fin=false;const end=()=>{if(fin)return;fin=true;clearTimeout(t);done();};
      u.onend=end;u.onerror=end;
      if(opts.onb)u.onboundary=e=>{if(!e.name||e.name==='word')opts.onb(e.charIndex);};
      const t=setTimeout(end,1800+text.length*120/DB.settings.rate);
      speechSynthesis.speak(u);
    }catch(e){done();}
  });
}
function hush(){speakId++;setTalking(false);try{Voice.supported&&speechSynthesis.cancel();}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hush();});

let AC=null;
function ensureAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f1,f2,dur,type,when=0,vol=.16){if(!AC||!DB.settings.sfx)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function sfx(k){if(k==='ok'){tone(660,660,.13,'sine');tone(880,880,.13,'sine',.11);tone(1320,1320,.22,'sine',.22);}else if(k==='no'){tone(320,170,.28,'triangle',0,.2);}else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,f,.22,'sine',i*.13));}else if(k==='tap'){tone(520,560,.07,'sine',0,.09);}}
function burst(el){if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const b=el.getBoundingClientRect(),cols=['#FF8A3D','#FFC93C','#138A7E','#E5487A','#2F8FD8'];
  for(let i=0;i<16;i++){const s=document.createElement('span'),a=Math.random()*Math.PI*2,d=60+Math.random()*80;s.className='cf';s.style.cssText=`left:${b.left+b.width/2}px;top:${b.top+b.height/2}px;background:${cols[i%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),850);}}

const isDone=(p,k)=>!!(p&&p.done[k]);
const unitDone=(p,u)=>u.acts.every(a=>isDone(p,a.key));
const nextAct=p=>{const k=PATH.find(k=>!isDone(p,k));return k?ACTS[k]:null;};
const nextInStage=(p,st)=>{const k=PATH.find(k=>ACTS[k].unit.stage===st&&!isDone(p,k));return k?ACTS[k]:null;};
const nextAfter=(p,a)=>a.unit.acts.find(x=>!isDone(p,x.key))||nextAct(p);
function stageProg(p,st){let d=0,t=0;STAGE(st).units.forEach(u=>u.acts.forEach(a=>{t++;if(isDone(p,a.key))d++;}));return{d,t};}
function totals(p){let d=0,stars=0;Object.keys(p.done).forEach(k=>{if(ACTS[k]){d++;stars+=p.done[k].stars;}});return{d,t:PATH.length,stars};}
function stickers(p){let e=0,t=0;Object.values(UNITS).forEach(u=>{t++;if(unitDone(p,u))e++;});return{e,t};}
function record(a,stars,errors){const p=cur();const was=unitDone(p,a.unit),prev=p.done[a.key];
  p.done[a.key]={stars:Math.max(stars,prev?prev.stars:0),errors,plays:(prev?prev.plays:0)+1,last:Date.now()};
  p.log.unshift({k:a.key,at:Date.now(),stars,errors});p.log=p.log.slice(0,60);save();return !was&&unitDone(p,a.unit);}
function addTime(ms){const p=cur();if(!p||!(ms>0))return;ms=Math.min(ms,20*60000);const d=dayKey();p.time[d]=(p.time[d]||0)+ms;save();}

/* Área privada de cada conta: data/users/<id>/familia (ajustes e lista de crianças)
   e data/users/<id>/crianca-<pid> (progresso de cada criança). */
const IN_CLAUDE=!!(window.claude&&window.claude.use);   // aberto pelo link do Claude (pode salvar na conta) ou num site comum
const canon=v=>v===null||typeof v!=='object'?JSON.stringify(v===undefined?null:v):Array.isArray(v)?'['+v.map(canon).join(',')+']':'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
const kidOf=p=>({pid:p.id,done:p.done,log:p.log,err:p.err,time:p.time,resetAt:p.resetAt||0});
const famOf=()=>({v:1,settings:DB.settings,profiles:DB.profiles.map(p=>({id:p.id,name:p.name,avatar:p.avatar,example:!!p.example}))});
function mergeKid(a,b){
  if(!b)return a;if(!a)return b;
  const R=Math.max(a.resetAt||0,b.resetAt||0),cur2=[a,b].filter(s=>(s.resetAt||0)===R);
  const done={};
  for(const s of [a,b])for(const[k,v]of Object.entries(s.done||{})){if((v.last||0)<=R)continue;const c=done[k];
    done[k]=!c?v:{stars:Math.max(c.stars,v.stars),errors:(v.last>=c.last?v:c).errors,plays:Math.max(c.plays||1,v.plays||1),last:Math.max(c.last,v.last)};}
  const seen=new Set(),log=[...(a.log||[]),...(b.log||[])].filter(l=>l.at>R&&!seen.has(l.k+l.at)&&seen.add(l.k+l.at)).sort((x,y)=>y.at-x.at).slice(0,60);
  const err={},time={};
  for(const s of cur2){for(const[k,v]of Object.entries(s.err||{}))err[k]=Math.max(err[k]||0,v);for(const[k,v]of Object.entries(s.time||{}))time[k]=Math.max(time[k]||0,v);}
  return{pid:a.pid||b.pid,done,log,err,time,resetAt:R};
}
const Sync={

  set(s){if(this.state===s)return;this.state=s;const el=$('#sync-status');if(el)el.textContent=this.label();},

      if(!window.claude||!claude.use){this.set('local');return;}
      this.set('connecting');
      const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      const uid=user?await user.id():null;
      if(!db||!uid){this.set('local');quietRender();return;}
      this.db=db;this.uid=uid;
      this.loadTimer=setTimeout(()=>{if(!this.ready)this.set('offline');},10000);
      db.collection('data/users/'+uid).onSnapshot(snap=>this.onSnap(snap),()=>{this.set('offline');});
    }catch(e){this.set('local');}
  },
  onSnap(snap){
    const remote={};snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data();});
    this.remote=remote;
    const first=!this.ready&&!snap.metadata.fromCache;
    if(!snap.metadata.fromCache){this.ready=true;clearTimeout(this.loadTimer);if(['connecting','offline'].includes(this.state))this.set('saved');}
    if(this.timer||this.busy)return;                       // mudanças locais ainda subindo: a próxima leitura traz o resultado
    const fam=remote.familia;
    if(!fam){if(first)quietRender();if(this.ready&&DB.profiles.length)this.schedule(0);return;}   // primeira vez nesta conta: envia o que há no aparelho
    if(first)quietRender();
    const before=JSON.stringify(DB);
    if(fam.settings)DB.settings={...DB.settings,...fam.settings};
    const local=Object.fromEntries(DB.profiles.map(p=>[p.id,p]));
    DB.profiles=(fam.profiles||[]).map(m=>{const k=mergeKid(local[m.id]?kidOf(local[m.id]):null,remote['crianca-'+m.id]||null)||{};
      return{id:m.id,name:m.name,avatar:m.avatar,example:!!m.example,done:k.done||{},log:k.log||[],err:k.err||{},time:k.time||{},resetAt:k.resetAt||0};});
    if(JSON.stringify(DB)!==before){saveLocal();if(S.p&&!cur())S.p=null;quietRender();}
    if(this.ready&&this.pending().length)this.schedule(0); // havia progresso só neste aparelho
  },
  pending(){
    const docs=[];const f=famOf();if(canon(f)!==canon(this.remote.familia))docs.push(['familia',f]);
    DB.profiles.forEach(p=>{const id='crianca-'+p.id,k=mergeKid(kidOf(p),this.remote[id]||null);if(canon(k)!==canon(this.remote[id]))docs.push([id,k]);});
    Object.keys(this.remote).forEach(id=>{if(id.startsWith('crianca-')&&!DB.profiles.some(p=>'crianca-'+p.id===id))docs.push([id,null]);});
    return docs;
  },
  schedule(ms=800){if(!this.db||!this.ready)return;clearTimeout(this.timer);this.timer=setTimeout(()=>{this.timer=null;this.flush();},ms);},
  async flush(){
    if(this.busy){this.again=true;return;}
    const docs=this.pending();if(!docs.length){this.set('saved');return;}
    this.busy=true;this.set('saving');let failed=null;
    for(const[id,body]of docs){                               // um documento por vez
      const ref=this.db.doc('data/users/'+this.uid+'/'+id);
      try{if(body===null){await ref.delete();delete this.remote[id];}
        else{await ref.set(body);this.remote[id]=JSON.parse(JSON.stringify(body));
          if(id.startsWith('crianca-')){const p=DB.profiles.find(x=>'crianca-'+x.id===id);if(p)Object.assign(p,{done:body.done,log:body.log,err:body.err,time:body.time});}}}
      catch(e){failed=e;break;}
    }
    this.busy=false;saveLocal();
    if(failed)this.set(failed.code==='quota_exceeded'?'full':'error');else this.set('saved');
    if(this.again){this.again=false;this.schedule(400);}
  }
};

async function setupTrace(r){

  [cg,cu].forEach(c=>{c.width=Math.round(size*dpr);c.height=Math.round(size*dpr);});
  const g=cg.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);

function traceScore(T){
  const W=T.cu.width,d=T.u.getImageData(0,0,W,W).data,k=T.dpr,r=T.size*.045;
  const hit=(x,y)=>{const px=Math.round(x*k),py=Math.round(y*k);return px>=0&&py>=0&&px<W&&py<W&&d[(py*W+px)*4+3]>0;};

  const xs=T.pts.map(p=>p[0]),ys=T.pts.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),cw=(Math.max(...xs)-x0)/3+1,ch=(Math.max(...ys)-y0)/3+1;

  const select=i=>{sel=i;$$('.drag').forEach((d,j)=>d.classList.toggle('sel',j===i));say(`${cap(r.items[i][1])}. Agora toque na sombra.`);};
  async function drop(i,zi){

      if(r.left<=0){G.busy=true;await say(`${rnd(PRAISE)} Todas as figuras acharam a sombra!`);if(!G||tok!==G.token)return;nextRound();}

      say('Ops! Essa sombra é de outra figura. Olhe o formato e tente outra.');
      if(G.roundErr>=2){const zj=r.zones.findIndex(x=>x[0]===r.items[i][0]);if(zj>=0)$$('.zone')[zj].classList.add('hint');}}

    el.onpointerup=el.onpointercancel=e=>{if(!drag||drag.el!==el)return;const d=drag;drag=null;el.classList.remove('lift');

    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(+el.dataset.d);}};
  });
  $$('.zone').forEach(z=>{z.onclick=()=>{if(sel!=null)drop(sel,+z.dataset.z);else say('Arraste uma figura até a sombra dela.');};});
}

function renderBubbles(r){
  app.innerHTML=`<div class="game" style="--ct:var(--t-pensar)">${gbar()}
   <div class="ask"><div class="ask-row">${lelo()}<div class="ask-card" style="min-width:120px;min-height:120px;padding:10px 16px">${showHtml(r.show)}</div></div>
   <div class="bcount" role="img" aria-label="Faltam ${r.n} bolhas">${'<i></i>'.repeat(r.n)}</div></div>
   <div class="pond"></div></div>`;
  runBubbles(r);
}
function runBubbles(r){
  const tok=G.token,pond=$('.pond'),B=[];let spawnT=.3,miss=0,prev=performance.now();r.got=0;r.over=false;
  function spawn(){
    const W=pond.clientWidth,H=pond.clientHeight,s=Math.round(Math.min(112,Math.max(80,W*.24)));
    const tgt=r.mode==='all'||miss>=2||Math.random()<.5;miss=tgt?0:miss+1;
    const c=r.mode==='all'?rnd(r.pool):tgt?r.target:rnd(r.others);
    const el=document.createElement('button');el.className='bub';el.style.cssText=`width:${s}px;height:${s}px;font-size:${s}px`;
    if(r.mode==='letter'){el.innerHTML=`<span class="bl">${esc(c)}</span>`;el.setAttribute('aria-label','Bolha com a letra '+c);}
    else{el.innerHTML=`<span class="emo">${c[0]}</span>`;el.setAttribute('aria-label','Bolha com '+c[1]);}
    const b={el,c,tgt,s,x:Math.random()*Math.max(0,W-s),y:H+6,vy:r.speed*(.85+Math.random()*.3),ph:Math.random()*6.3};el._b=b;
    el.style.left=b.x+'px';el.style.top=b.y+'px';pond.appendChild(el);B.push(b);}
  pond.onpointerdown=e=>{const el=e.target.closest('.bub');if(!el||!G||G.token!==tok||G.busy)return;e.preventDefault();hitBubble(r,el._b,tok);};
  function frame(t){
    if(!G||G.token!==tok||!pond.isConnected)return;const dt=Math.min(.05,(t-prev)/1000);prev=t;
    if(!r.over){spawnT-=dt;if(spawnT<=0&&B.filter(b=>!b.dead).length<r.max){spawn();spawnT=r.every;}}
    for(let i=B.length-1;i>=0;i--){const b=B[i];if(b.dead){B.splice(i,1);continue;}
      b.y-=b.vy*dt;b.ph+=dt*1.8;b.el.style.left=(b.x+Math.sin(b.ph)*10)+'px';b.el.style.top=b.y+'px';
      if(b.y<-b.s){b.el.remove();B.splice(i,1);}}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
}
async function hitBubble(r,b,tok){
  if(!b||b.dead)return;
  if(b.tgt){b.dead=true;b.el.classList.add('pop');sfx('tap');setTimeout(()=>b.el.remove(),240);r.got++;const dot=$$('.bcount i')[r.got-1];if(dot)dot.classList.add('on');
    if(r.got>=r.n){r.over=true;G.busy=true;sfx('ok');burst($('.pond'));await say(`${rnd(PRAISE)} ${r.praise}`);if(!G||tok!==G.token)return;nextRound();}
  }else{if(b.warned)return;b.warned=true;G.errors++;if(r.errLetter)bumpErr(r.errLetter);sfx('no');b.el.classList.add('no');say(r.wrongSay(b.c));}
}

const FORMS={
 gate(f){const v=parseInt($('#gate-ans').value,10);
   if(v===S.gate.a*S.gate.b){S.gate=null;S.adding=S.afterGate==='add';S.afterGate=null;S.formErr='';go('parents');if(S.adding)setTimeout(()=>{const i=$('#add-name');if(i)i.focus();},30);}else{newGate();S.gate.err='Resposta errada. Tente esta outra conta.';render();}},
 add(f){const name=$('#add-name').value.trim(),av=(f.querySelector('input[name="add-av"]:checked')||{}).value||AVATARS[0];
   if(!name){S.formErr='Escreva o nome da criança.';render();return;}
   const p={id:'p'+Date.now(),name:name.slice(0,20),avatar:av,done:{},log:[],err:{},time:{}};DB.profiles.push(p);save();S.adding=false;S.formErr='';S.pc=p.id;render();},
 ren(f){const p=DB.profiles.find(x=>x.id===S.renaming);const name=$('#ren-name').value.trim(),av=(f.querySelector('input[name="ren-av"]:checked')||{}).value;
   if(!name){S.formErr='Escreva o nome da criança.';render();return;}
   if(p){p.name=name.slice(0,20);if(av)p.avatar=av;p.example=false;save();}S.renaming=null;S.formErr='';render();}
};
const CHANGES={
 voice(el){DB.settings.voice=el.value;save();pickVoice();say('Esta é a voz do Lelo.');},
 rate(el){DB.settings.rate=parseFloat(el.value);save();render();say('Esta é a velocidade da fala.');},
 sfx(el){DB.settings.sfx=el.checked;save();if(el.checked){ensureAudio();sfx('ok');}}
};
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||!app.contains(el))return;const fn=A[el.dataset.action];if(fn){e.preventDefault();fn(el,e);}});
app.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')){const h=e.target.closest('[data-hold]');if(h){e.preventDefault();exitGame();return;}
    if(e.target.getAttribute('role')==='button'&&e.target.dataset.action){e.preventDefault();e.target.click();}}});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target.closest('form[data-form]');if(f&&FORMS[f.dataset.form])FORMS[f.dataset.form](f);});
app.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&CHANGES[el.dataset.change])CHANGES[el.dataset.change](el);});
document.addEventListener('pointerdown',()=>{unlocked=true;ensureAudio();},{capture:true});
document.addEventListener('keydown',()=>{unlocked=true;},{capture:true});
/* Sair do jogo só segurando o botão da casinha */
let holdT=null;
app.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-hold]');if(!h)return;e.preventDefault();h.classList.add('holding');
  holdT=setTimeout(()=>{holdT=null;h.classList.remove('holding');exitGame();},900);});
const cancelHold=()=>{if(!holdT)return;clearTimeout(holdT);holdT=null;$$('.holding').forEach(x=>x.classList.remove('holding'));say('Para sair, segure a casinha.');};
app.addEventListener('pointerup',cancelHold);app.addEventListener('pointercancel',cancelHold);

render();
Sync.init();
</script>
</body>
</html>
