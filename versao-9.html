    :Voice.ok?`<p class="okline">Voz em português ativa: <b>${esc(Voice.v.name)}</b></p>`
    :`<p class="warn">Não há voz em português instalada neste aparelho. Sem ela, a criança não ouve as instruções.<br><b>Android:</b> Configurações › Sistema › Idioma › Saída de texto para fala › instale Português (Brasil).<br><b>iPhone/iPad:</b> Ajustes › Acessibilidade › Conteúdo Falado › Vozes › Português (Brasil).</p>`}
   ${Voice.list.length>1?`<div class="field"><label for="voice-sel">Escolher a voz</label><select id="voice-sel" data-change="voice">${Voice.list.map(v=>`<option value="${esc(v.voiceURI)}"${Voice.v&&v.voiceURI===Voice.v.voiceURI?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div>`:''}
   <div class="field"><label for="rate">Velocidade da fala: ${r<.85?'devagar':r>1.05?'rápida':'normal'}</label><input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${r}" data-change="rate"></div>
   <div class="btns"><button class="btnq" data-action="testVoice">Ouvir teste</button></div></section>`;
}
function childForm(mode,p){
  const av=p?p.avatar:AVATARS[0];
  return `<form class="panel" style="box-shadow:none;background:var(--sky)" data-form="${mode}" novalidate>
   <div class="field"><label for="${mode}-name">Nome da criança</label><input type="text" id="${mode}-name" maxlength="20" value="${p?esc(p.name):''}" autocomplete="off"></div>
   <span class="lbl">Figura da criança (é o que ela vai tocar para entrar)</span>
   <div class="avpick">${AVATARS.map((a,i)=>`<input type="radio" name="${mode}-av" id="${mode}-av-${i}" value="${a}"${a===av?' checked':''}><label for="${mode}-av-${i}">${a}</label>`).join('')}</div>
   <p class="err" role="alert">${esc(S.formErr||'')}</p>
   <div class="btns"><button class="btnp" type="submit">${mode==='add'?'Adicionar':'Salvar'}</button><button class="btnq" type="button" data-action="cancelForm">Cancelar</button></div></form>`;
}
function childReport(p){
  const tot=totals(p),nx=nextAct(p);
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d;});
  const vals=days.map(d=>p.time[dayKey(d)]||0),max=Math.max(...vals,60000),week=vals.reduce((a,b)=>a+b,0);
  const weak=Object.entries(p.err).filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const wd=['dom','seg','ter','qua','qui','sex','sáb'];
  return `<section class="panel">
   <h2><span class="emo">${p.avatar}</span> ${esc(p.name)}${p.example?'<span class="tag">Perfil de exemplo</span>':''}</h2>
   ${p.example?'<p class="note">Este perfil vem com um pouco de progresso de exemplo. Renomeie, zere ou apague quando quiser.</p>':''}
   ${S.renaming===p.id?childForm('ren',p):''}
   <div class="kpis">
    <div class="kpi"><small>Brincadeiras feitas</small><b>${tot.d} de ${tot.t}</b></div>
    <div class="kpi"><small>Estrelas</small><b>${tot.stars}</b></div>
    <div class="kpi"><small>Tempo hoje</small><b>${fmtMin(p.time[dayKey()])}</b></div>
    <div class="kpi"><small>Últimos 7 dias</small><b>${fmtMin(week)}</b></div></div>
   <h3>Próximo passo recomendado</h3>
   <p>${nx?`<b>${esc(nx.label)}</b> (${STAGE(nx.unit.stage).name}). É o mesmo que aparece para a criança no botão “Continuar”.`:'Trilha concluída.'}</p>
   <h3>Tempo por dia</h3>
   <div class="week">${days.map((d,i)=>`<div class="wd"><b>${Math.round(vals[i]/60000)}</b><i style="height:${vals[i]/max*85}%"></i><span>${wd[d.getDay()]}</span></div>`).join('')}</div>
   <h3>Progresso por etapa</h3>
   ${STAGES.map(s=>{const{d,t}=stageProg(p,s.id);return `<div class="prow" style="--c:var(--c-${s.id})"><span>${s.name}</span><em>${d}/${t}</em><span class="bar"><i style="width:${t?d/t*100:0}%"></i></span></div>`;}).join('')}
   <h3>Letras que precisam de reforço</h3>
   ${weak.length?`<div class="chips">${weak.map(([L,c])=>`<span class="lchip">${L}<small>${c} erros</small></span>`).join('')}</div><p class="note">Letras em que a criança errou 2 vezes ou mais. Vale repetir as brincadeiras delas.</p>`:'<p>Nenhuma por enquanto.</p>'}
   <h3>Últimas brincadeiras</h3>
   ${p.log.length?`<ul class="log">${p.log.slice(0,8).map(l=>{const a=ACTS[l.k];if(!a)return'';return `<li><span>${esc(a.label)}<br><small>${STAGE(a.unit.stage).name} · ${fmtDate(l.at)}</small></span><span>${starsHtml(l.stars)}<br><small>${l.errors} ${l.errors===1?'erro':'erros'}</small></span></li>`;}).join('')}</ul>`:'<p>Ainda não jogou.</p>'}
   <p class="note">Estes números mostram uso e acertos. Não são avaliação nem diagnóstico de leitura.</p>
   <div class="btns">
    <button class="btnq" data-action="rename" data-id="${p.id}">Mudar nome ou figura</button>
    ${S.confirmReset===p.id?`<button class="btnd" data-action="doReset" data-id="${p.id}">Sim, zerar o progresso</button><button class="btnq" data-action="cancelConfirm">Cancelar</button>`:`<button class="btnq" data-action="askReset" data-id="${p.id}">Zerar progresso</button>`}
    ${S.confirmDel===p.id?`<button class="btnd" data-action="doDel" data-id="${p.id}">Sim, apagar ${esc(p.name)}</button><button class="btnq" data-action="cancelConfirm">Cancelar</button>`:`<button class="btnd" data-action="askDel" data-id="${p.id}">Apagar criança</button>`}
   </div></section>`;
}

/* ================= Ações ================= */
const A={
 repeat(){if(G){const r=G.rounds[G.i];if(r.build)say(`${r.word}. ${r.prompt}`);else say(r.prompt);}else say(S.narr);},
 profile(el){S.p=el.dataset.id;go('home');},
 profiles(){go('profiles');},
 home(){go('home');},
 stage(el){go('stage',{stage:el.dataset.id});},
 unit(el){go('unit',{unit:el.dataset.id});},
 act(el){startAct(el.dataset.id);},
 album(){go('album');},
 trophies(){go('trophies');},
 sayStars(){say(`Você tem ${totals(cur()).stars} estrelas!`);},
 sticker(el){const u=UNITS[el.dataset.id];if(unitDone(cur(),u))say(`${cap(u.st[1])}!`);else say(`Termine ${u.need} para ganhar esta figurinha.`);},
 trophy(el){const p=cur();if(el.dataset.id==='all'){const t=totals(p);say(`Trilha completa: você fez ${t.d} de ${t.t}.`);return;}
   const s=STAGE(el.dataset.id),{d,t}=stageProg(p,s.id);say(`${s.name}. Você fez ${d} de ${t}.${d===t?' Troféu conquistado!':''}`);},
 pick(el){onPick(+el.dataset.i);},
 hear(el){const r=G&&G.rounds[G.i];if(r)say(r.options[+el.dataset.i].say);},
 tile(el){onTile(+el.dataset.i);},
 mem(el){onMem(+el.dataset.i);},
 ord(el){onOrd(+el.dataset.i);},
 fiz(){onFiz();},
 step(el){onStep(+el.dataset.i);},
 stepHear(el){const r=G&&G.rounds[G.i];if(r&&r.steps)say(r.items[r.order[+el.dataset.i]][1]);},
 toolHear(){const r=G&&G.rounds[G.i];if(r&&r.clean){const p=r.phases[r.ph];say(`${cap(p.tool[1])}. ${p.say}`);}},
 erase(){if(G&&G.trace){G.trace.u.clearRect(0,0,G.trace.size,G.trace.size);G.trace.drawn=[];G.trace.warned=false;if(G.trace.place)G.trace.place(G.trace.place.start);say('Apagado. Tente de novo.');}},
 traceDone(){checkTrace(true);},
 parents(){S.back=S.screen==='home'?'home':'profiles';newGate();go('gate');},
 gateBack(){go(S.back||'profiles');},
 leaveParents(){S.adding=false;S.renaming=null;S.confirmDel=null;S.confirmReset=null;go('profiles',{p:null});},
 pchild(el){S.pc=el.dataset.id;S.renaming=null;S.confirmDel=null;S.confirmReset=null;render();},
 showAdd(){S.adding=true;S.formErr='';render();setTimeout(()=>{const i=$('#add-name');if(i)i.focus();},30);},
 rename(el){S.renaming=el.dataset.id;S.formErr='';render();setTimeout(()=>{const i=$('#ren-name');if(i)i.focus();},30);},
 cancelForm(){S.adding=false;S.renaming=null;S.formErr='';render();},
 askDel(el){S.confirmDel=el.dataset.id;S.confirmReset=null;render();},
 askReset(el){S.confirmReset=el.dataset.id;S.confirmDel=null;render();},
 cancelConfirm(){S.confirmDel=null;S.confirmReset=null;render();},
 doDel(el){DB.profiles=DB.profiles.filter(p=>p.id!==el.dataset.id);if(S.p===el.dataset.id)S.p=null;S.confirmDel=null;save();render();},
 doReset(el){const p=DB.profiles.find(x=>x.id===el.dataset.id);if(p){p.done={};p.log=[];p.err={};p.time={};p.example=false;p.resetAt=Date.now();}S.confirmReset=null;save();render();},
 firstKid(){S.back='profiles';S.afterGate='add';newGate();go('gate');},
 testVoice(){say('Oi! Eu sou o Lelo. Vamos aprender as letras brincando? A, de abelha. Bê, de bola.');}
};
const FORMS={
 gate(f){const v=parseInt($('#gate-ans').value,10);
   if(v===S.gate.a*S.gate.b){S.gate=null;S.adding=S.afterGate==='add';S.afterGate=null;S.formErr='';go('parents');if(S.adding)setTimeout(()=>{const i=$('#add-name');if(i)i.focus();},30);}else{newGate();S.gate.err='Resposta errada. Tente esta outra conta.';render();}},
 add(f){const name=$('#add-name').value.trim(),av=(f.querySelector('input[name="add-av"]:checked')||{}).value||AVATARS[0];
   if(!name){S.formErr='Escreva o nome da criança.';render();return;}
   const p={id:'p'+Date.now(),name:name.slice(0,20),avatar:av,done:{},log:[],err:{},time:{}};DB.profiles.push(p);save();S.adding=false;S.formErr='';S.pc=p.id;render();},
 ren(f){const p=DB.profiles.find(x=>x.id===S.renaming);const name=$('#ren-name').value.trim(),av=(f.querySelector('input[name="ren-av"]:checked')||{}).value;
   if(!name){S.formErr='Escreva o nome da criança.';render();return;}
   if(p){p.name=name.slice(0,20);if(av)p.avatar=av;p.example=false;save();}S.renaming=null;S.formErr='';render();}
};
const CHANGES={
 voice(el){DB.settings.voice=el.value;save();pickVoice();say('Esta é a voz do Lelo.');},
 rate(el){DB.settings.rate=parseFloat(el.value);save();render();say('Esta é a velocidade da fala.');},
 sfx(el){DB.settings.sfx=el.checked;save();if(el.checked){ensureAudio();sfx('ok');}},
 bodyDur(el){DB.settings.bodyDur=el.value;save();},
 music(el){DB.settings.music=el.checked;save();if(el.checked){Music.play('danca');setTimeout(()=>Music.stop(),3000);}else Music.stop();}
};
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||!app.contains(el))return;const fn=A[el.dataset.action];if(fn){e.preventDefault();fn(el,e);}});
app.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')){const h=e.target.closest('[data-hold]');if(h){e.preventDefault();exitGame();return;}
    if(e.target.getAttribute('role')==='button'&&e.target.dataset.action){e.preventDefault();e.target.click();}}});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target.closest('form[data-form]');if(f&&FORMS[f.dataset.form])FORMS[f.dataset.form](f);});
app.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&CHANGES[el.dataset.change])CHANGES[el.dataset.change](el);});
document.addEventListener('pointerdown',()=>{unlocked=true;ensureAudio();},{capture:true});
document.addEventListener('keydown',()=>{unlocked=true;},{capture:true});
/* Sair do jogo só segurando o botão da casinha */
let holdT=null;
app.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-hold]');if(!h)return;e.preventDefault();h.classList.add('holding');
  holdT=setTimeout(()=>{holdT=null;h.classList.remove('holding');exitGame();},900);});
const cancelHold=()=>{if(!holdT)return;clearTimeout(holdT);holdT=null;$$('.holding').forEach(x=>x.classList.remove('holding'));say('Para sair, segure a casinha.');};
app.addEventListener('pointerup',cancelHold);app.addEventListener('pointercancel',cancelHold);

render();
Sync.init();
</script>
</body>
</html>
