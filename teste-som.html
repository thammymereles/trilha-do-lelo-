<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de som</title>
<style>
  :root{--bg:#F3FAF8;--ink:#1F2D2B;--card:#fff;--ok:#138A7E;--line:#D5E7E3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
  main{max-width:520px;margin:0 auto}
  h1{font-size:24px;margin:4px 0 6px}
  p{margin:0 0 14px}
  .t{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
  button{display:block;width:100%;font:inherit;font-weight:700;padding:14px;border:0;border-radius:12px;background:var(--ok);color:#fff;cursor:pointer}
  .r{margin:10px 0 0;font-size:15px;min-height:1.4em;word-break:break-word}
  .info{font-size:13px;color:#4A5C59;word-break:break-word}
</style>
</head>
<body>
<main>
  <h1>Teste de som</h1>
  <p>Aumente o volume do celular, desligue o modo silencioso e toque em cada botão. Para cada um, anote se você <b>ouviu</b> ou <b>não ouviu</b> o som.</p>

  <div class="t"><button id="b1">1. Voz do celular</button><p class="r" id="r1"></p></div>
  <div class="t"><button id="b2">2. Voz do celular, uma de cada vez</button><p class="r" id="r2"></p></div>
  <div class="t"><button id="b3">3. Bip (igual às músicas do app)</button><p class="r" id="r3"></p></div>
  <div class="t"><button id="b4">4. Som de arquivo (igual a um vídeo)</button><p class="r" id="r4"></p></div>

  <p class="info" id="info"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const S='speechSynthesis' in window;
const pt=()=>S?speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang)):[];
function info(){$('info').textContent='Fala: '+(S?'sim':'não')+' · vozes: '+(S?speechSynthesis.getVoices().length:0)+' (português: '+pt().map(v=>v.name+' '+v.lang).join(', ')+') · '+navigator.userAgent;}
info();if(S)speechSynthesis.onvoiceschanged=info;setTimeout(info,1500);

function speak(text,voice,out){return new Promise(res=>{
  if(!S){out('Este navegador não tem fala.');res();return;}
  const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang.replace('_','-'):'pt-BR';if(voice)u.voice=voice;u.volume=1;u.rate=1;
  const t0=Date.now(),ms=()=>((Date.now()-t0)/1000).toFixed(1)+'s',name=voice?voice.name:'voz padrão';let ok=false;
  u.onstart=()=>{ok=true;out(name+': começou ('+ms()+')');};
  u.onend=()=>{out(name+': '+(ok?'terminou':'terminou sem começar')+' ('+ms()+')');res();};
  u.onerror=e=>{out(name+': erro "'+e.error+'" ('+ms()+')');res();};
  setTimeout(()=>{if(!ok){out(name+': não começou em 6s');res();}},6000);
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
  speechSynthesis.speak(u);});}

$('b1').onclick=()=>{const r=$('r1');r.textContent='Falando…';speak('Oi! Eu sou o Lelo. Você está me ouvindo?',null,x=>r.textContent=x);};
$('b2').onclick=async()=>{const r=$('r2'),vs=pt();r.innerHTML='';if(!vs.length){r.textContent='Nenhuma voz em português encontrada.';return;}
  for(const v of vs){const line=document.createElement('div');line.textContent=v.name+': falando…';r.appendChild(line);
    await speak('Esta é a voz '+(vs.indexOf(v)+1)+'.',v,x=>line.textContent=x);await new Promise(z=>setTimeout(z,400));}};

let AC=null;
$('b3').onclick=()=>{const r=$('r3');try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume();
  const t=AC.currentTime+.05;[523,659,784].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.18);g.gain.exponentialRampToValueAtTime(.3,t+i*.18+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.18+.3);o.connect(g).connect(AC.destination);o.start(t+i*.18);o.stop(t+i*.18+.35);});
  setTimeout(()=>{r.textContent='Bip enviado (estado: '+AC.state+')';},300);}catch(e){r.textContent='Erro: '+e.message;}};

function wav(){const sr=22050,n=Math.floor(sr*.9),b=new ArrayBuffer(44+n*2),d=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);
  d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const t=i/sr,f=t<.3?523:t<.6?659:784,env=Math.min(1,(t%.3)*40)*Math.max(0,1-(t%.3)/.3);d.setInt16(44+i*2,Math.sin(2*Math.PI*f*t)*env*12000,true);}
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
let src=null;
$('b4').onclick=()=>{const r=$('r4');src=src||wav();const a=new Audio(src);a.onended=()=>r.textContent='Tocou até o fim';
  a.play().then(()=>r.textContent='Tocando…').catch(e=>r.textContent='Bloqueado: '+e.message);};
</script>
</body>
</html>
